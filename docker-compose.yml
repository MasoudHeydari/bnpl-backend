services:
  db:
    image: docker.arvancloud.ir/postgres:18
    container_name: bnpl-db
    environment:
      POSTGRES_DB: bnpl_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data_bnpl:/var/lib/postgresql
    ports:
      - "5432:5432"

volumes:
  postgres_data_bnpl:
