syntax = "proto3";

package common.v1;

option go_package = "github.com/parstis/bnpl-backend/gen/proto/common/v1;commonv1";

// Shared BNPL platform wire primitives for non-Financial Core services
// (notification, customer reference adapters, and future BNPL-owned contracts).
// Financial Core public primitives live under financial/common/v1 and must not
// be imported from here.
message Money {
  int64 amount_minor = 1;
  string currency = 2;
}

message BusinessSourceReference {
  string type = 1;
  string id = 2;
  optional int64 version = 3;
}

message PaymentReturnUrls {
  string success_url = 1;
  string failure_url = 2;
  string cancel_url = 3;
}
