syntax = "proto3";

package payment.v1;

option go_package = "github.com/parstis/bnpl-backend/gen/proto/payment/v1;paymentv1";

import "google/protobuf/timestamp.proto";
import "common/v1/common.proto";

// Financial Core checkout payment service.
//
// Canonical published external checkout contract:
//   package payment.v1
//   service CheckoutPaymentService
// Artifact: contracts/external/checkout-payment/v1/
// Contract version: 2.0.0
// Compatibility: PRE_LAUNCH_BREAKING_RESET_NO_PUBLISHED_IN_REPO_CONSUMERS
//
// Public Financial authority is intentionally absent from this contract:
// - FinancialScope is derived from the selected Financial target artifact
// - source_service comes only from authenticated transport identity (SPIFFE)
// - request fingerprint is owned and computed by Financial Core
// - idempotency_record_id is owned and generated by Financial Core
//
// Callers select an explicit Financial target via CheckoutPaymentTarget.
service CheckoutPaymentService {
  // Creates a checkout payment and returns a customer-action payment link.
  //
  // Server-side implementation rules:
  // - map request to CreateCheckoutPaymentCommand
  // - execute through CreateCheckoutPaymentGrpcServiceShell
  // - execute the use case through TransactionalUseCaseExecutor
  // - return provider verification/allocation/ledger results through later flows
  rpc CreateCheckoutPayment(CreateCheckoutPaymentRequest)
      returns (CreateCheckoutPaymentResponse);

  // Reads the latest Financial-owned checkout payment status.
  //
  // This RPC is a side-effect-free query. It does not expire payments, allocate
  // invoices, or verify the payment provider. Callers poll until a terminal
  // status is returned.
  rpc GetPaymentStatus(GetPaymentStatusRequest)
      returns (GetPaymentStatusResponse);
}

// Financial party used in checkout payment creation.
//
// Supported party_type values:
// - customer: a customer-service customer. Only valid as the payer and only
//   with an Identity financial_delegation token (Authorization: Bearer) for
//   capability checkout.payment.create. Financial takes the paying customer
//   from the token, never from this message; party_id may be empty or the
//   customer-service customer_id, and a party_id that does not match the
//   token's customer is rejected with PERMISSION_DENIED.
// - merchant
// - platform
// - payment_provider
// - external
//
// Subject ids are never accepted: party_type "subject" is rejected. Tenant and
// context are never sent; Financial derives them from the payment target and
// the caller's mTLS/SPIFFE identity.
message FinancialParty {
  string party_type = 1;
  string party_id = 2;
}

// Explicit non-collection Financial invoice target.
message ExistingInvoiceCheckoutTarget {
  string invoice_id = 1;
}

// Explicit Collection Obligation Financial invoice target.
message CollectionObligationCheckoutTarget {
  string collection_obligation_id = 1;
}

// Type-safe checkout target. A request cannot represent both targets or neither.
message CheckoutPaymentTarget {
  oneof kind {
    ExistingInvoiceCheckoutTarget invoice = 1;
    CollectionObligationCheckoutTarget collection_obligation = 2;
  }
}

// CreateCheckoutPayment request.
//
// This operation creates a payment intent, starts a payment attempt, creates a
// payment session, and returns a payment link. It does not verify the provider
// result, allocate invoice payment, or post ledger entries.
//
// Exactly one CheckoutPaymentTarget kind is required. Financial Core validates
// the selected Financial artifact; it does not discover a target from product
// policy or caller-owned FinancialScope.
message CreateCheckoutPaymentRequest {
  common.v1.BusinessSourceReference source = 1;
  FinancialParty payer = 2;
  FinancialParty payee = 3;
  common.v1.Money payment_amount = 4;
  string provider_code = 5;
  common.v1.PaymentReturnUrls return_urls = 6;
  // Required, non-blank payment description.
  string description = 7;
  google.protobuf.Timestamp expires_at = 8;
  string idempotency_key = 9;
  CheckoutPaymentTarget target = 10;
}

// Checkout payment status returned by create checkout payment and
// GetPaymentStatus. Enum numbers are frozen; PROCESSING is additive.
enum CheckoutPaymentStatus {
  CHECKOUT_PAYMENT_STATUS_UNSPECIFIED = 0;
  CHECKOUT_PAYMENT_STATUS_REQUIRES_CUSTOMER_ACTION = 1;
  CHECKOUT_PAYMENT_STATUS_SUCCEEDED = 2;
  CHECKOUT_PAYMENT_STATUS_FAILED = 3;
  CHECKOUT_PAYMENT_STATUS_EXPIRED = 4;
  CHECKOUT_PAYMENT_STATUS_CANCELLED = 5;
  // Provider-verified Collection Obligation payment whose Financial
  // accounting has not yet completed. Keep polling. Not a failure.
  CHECKOUT_PAYMENT_STATUS_PROCESSING = 6;
}

// CreateCheckoutPayment success response.
//
// Failures must be returned through gRPC status/details by the generated service
// boundary, not as a successful response payload.
message CreateCheckoutPaymentResponse {
  string invoice_id = 1;
  string payment_intent_id = 2;
  string payment_attempt_id = 3;
  string payment_session_id = 4;

  CheckoutPaymentStatus status = 5;
  common.v1.Money payment_amount = 6;

  string payment_link = 7;
  google.protobuf.Timestamp expires_at = 8;

  bool reused_idempotent_result = 9;
}

// GetPaymentStatus request.
//
// Lookup is by payment_intent_id. Financial Core loads the intent, derives
// scope from the stored Financial artifact, and asserts source ownership.
// Source is business provenance, not an authority token.
message GetPaymentStatusRequest {
  common.v1.BusinessSourceReference source = 1;
  string payment_intent_id = 2;
}

// GetPaymentStatus success response.
//
// Failures must be returned through gRPC status, not as a successful payload.
// completed_at is present only when status is SUCCEEDED.
// PROCESSING means a Collection Obligation payment may already be
// provider-verified while Financial accounting is still pending. It is not
// failure. SUCCEEDED for Collection Obligation means provider verified and
// Financial accounting completed. Journal and ledger identifiers are not
// exposed.
message GetPaymentStatusResponse {
  string payment_intent_id = 1;
  CheckoutPaymentStatus status = 2;
  common.v1.Money payment_amount = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp expires_at = 5;
  google.protobuf.Timestamp completed_at = 6;
}