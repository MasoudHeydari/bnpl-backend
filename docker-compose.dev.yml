# dpay — unified Hamravesh / self-hosted Compose for the full platform + BNPL.
#
# Project name: dpay
# Public host:  dev.dlend.ir  (TLS-only Envoy :443; SAN must include this name)
#
# Hamravesh note:
#   Do NOT use env_file with host paths — Hamravesh rejects them.
#   All runtime ENV keys are declared under each service `environment:` as
#   plain literals (no ${VAR:-default}, no quoting). Edit values in-file or in
#   the Hamravesh panel.
#
# This file is the single Compose unit for:
#   - infrastructure (Postgres, Redis, Kafka, Temporal)
#   - platform services from the ENV-only handoff digests
#     (Identity / Customer / Financial Core / Notification + workers)
#   - BNPL API
#   - self-hosted Envoy gateway (not Hamravesh edge gateway)
#
# Kafka/Redis/DB addresses inside containers use Compose DNS names
# (dpay-postgres, dpay-kafka:29092, dpay-redis) — never localhost of the host.

name: dpay

# Scalar form (not a list) — Compose accepts both; GoLand schema expects a single value.
