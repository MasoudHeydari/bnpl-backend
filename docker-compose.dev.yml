# dpay — unified Hamravesh / self-hosted Compose for the full platform + BNPL.
#
# Project name: dpay
# Public host:  dev.dlend.ir  (TLS SAN must include this name; own Envoy gateway)
#
# This file is the single Compose unit for:
#   - infrastructure (Postgres, Redis, Kafka, Temporal)
#   - platform services from the ENV-only handoff digests
#     (Identity / Customer / Financial Core / Notification + workers)
#   - BNPL API
#   - self-hosted Envoy gateway (not Hamravesh edge gateway)
#
# Prerequisites:
#   1. Fill private/*.env from the handoff JSON templates (prepare-env.py).
#   2. Place TLS material at assets/dev/certs/tls.crt and tls.key for *.dev.dlend.ir.
#   3. docker compose -p dpay -f docker-compose.dev.yml --profile migration run --rm …
#   4. Then up the long-running roles (see assets/dev/README.md).
#
# Kafka/Redis/DB addresses inside containers must use Compose DNS names
# (dpay-postgres, dpay-kafka:29092, dpay-redis) — never localhost of the host.
#
# Compose 2.30+ recommended (env_file format: raw for private env files).

name: dpay

x-platform-tmpfs: &platform-tmpfs
  - /tmp:rw,noexec,nosuid,size=64m,mode=1777

x-identity-image: &identity-image
  image: ${IDENTITY_IMAGE:-registry.hamdocker.ir/parstis-technology/identity-service@sha256:408910ebecad5a3f0b592f229c3bc4ec8adee0dd24f5b0d0269e525708d1be46}

x-customer-image: &customer-image
  image: ${CUSTOMER_IMAGE:-registry.hamdocker.ir/parstis-technology/customer-service@sha256:9d7402768164bde13d34d0ff41258018184c77582f3ec82edee88a7ac1b36610}

x-financial-image: &financial-image
  image: ${FINANCIAL_CORE_IMAGE:-registry.hamdocker.ir/parstis-technology/financial-core-service@sha256:35e05c23f394ace90229621d82dc85a0d06a9f0e7e0b82683275caa904fe753a}

x-notification-image: &notification-image
  image: ${NOTIFICATION_IMAGE:-registry.hamdocker.ir/parstis-technology/notification-service@sha256:d008d62018efc1aecfcf190a9f6a4ae0f35182a9d81a7ed5da34488d63ad98be}

x-bnpl-image: &bnpl-image
  image: ${BNPL_IMAGE:-registry.hamdocker.ir/parstis-technology/bnpl-backend:v0.1.0-development}

services:
  # ── PostgreSQL (one instance, five databases) ───────────────────────────────
  postgres:
    image: ${POSTGRES_IMAGE:-docker.arvancloud.ir/postgres:18}
    container_name: dpay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bnpl}
      POSTGRES_USER: ${POSTGRES_USER:-dpay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - dpay_postgres_data:/var/lib/postgresql
      - ./assets/dev/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    # Not published publicly; apps reach it on dpay-net. Optional host debug bind:
    ports:
      - "${DPAY_PUBLISH_BIND:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dpay} -d ${POSTGRES_DB:-bnpl}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - dpay-net

  # ── Redis (Identity revocation projection) ──────────────────────────────────
  redis:
    image: ${REDIS_IMAGE:-docker.arvancloud.ir/redis:7-alpine}
    container_name: dpay-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - dpay_redis_data:/data
    ports:
      - "${DPAY_PUBLISH_BIND:-127.0.0.1}:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - dpay-net

  # ── Kafka (KRaft single-node; internal listener for Compose DNS) ─────────────
  kafka:
    image: ${KAFKA_IMAGE:-docker.arvancloud.ir/apache/kafka:4.3.1}
    hostname: dpay-kafka
    container_name: dpay-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://dpay-kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@dpay-kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - dpay_kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      dpay-net:
        aliases:
          - dpay-kafka
          - kafka

  kafka-init:
    image: ${KAFKA_IMAGE:-docker.arvancloud.ir/apache/kafka:4.3.1}
    container_name: dpay-kafka-init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      # init-topics.sh hardcodes bootstrap kafka:29092; compose gives kafka an alias.
      KAFKA_TOPICS: >-
        ${KAFKA_TOPIC_MERCHANT_CHECKOUT_EVENTS:-bnpl.merchant.checkout.events}
        ${KAFKA_TOPIC_PAYMENT_RESULTS:-financial-core.payment-results}
        ${KAFKA_TOPIC_AUDIT_EVENTS:-bnpl.audit.events.v1}
        ${KAFKA_TOPIC_PAYMENT_APPLICATION_RESULTS:-financial_core.payment_application_results}
        ${KAFKA_TOPIC_INSTALLMENT_PAYMENT_REQUESTS:-financial_core.installment_payment_requests}
        ${KAFKA_TOPIC_INSTALLMENT_PAYMENT_RECONCILIATION_REQUESTS:-bnpl.installment_payment_reconciliation_requests}
        ${KAFKA_TOPIC_INSTALLMENT_PAYMENT_RECONCILIATION_RESULTS:-financial_core.installment_payment_reconciliation_results}
        ${KAFKA_TOPIC_INSTALLMENT_PAYMENT_RECONCILIATION_ACKNOWLEDGEMENTS:-bnpl.installment_payment_reconciliation_acknowledgements}
        ${KAFKA_TOPIC_NOTIFICATION_SMS_REQUESTS:-notification.sms.requests}
        ${KAFKA_TOPIC_IDENTITY_AUTH_REVOCATIONS:-identity.auth.revocations.v1}
        ${KAFKA_TOPIC_IDENTITY_OUTBOX:-identity.outbox.v1}
        ${KAFKA_TOPIC_NOTIFICATION_COMMANDS:-notification.commands.v1}
        ${KAFKA_TOPIC_NOTIFICATION_LIFECYCLE:-parstis.notification.lifecycle.v1}
        ${KAFKA_CONSUMER_QUARANTINE_TOPIC:-bnpl.consumer.quarantine.v1}
    volumes:
      - ./scripts/kafka/init-topics.sh:/opt/kafka/init-topics.sh:ro
    entrypoint: ["/bin/bash", "/opt/kafka/init-topics.sh"]
    networks:
      - dpay-net

  # ── Temporal (BNPL jobs) ────────────────────────────────────────────────────
  temporal:
    image: ${TEMPORAL_IMAGE:-temporalio/temporal:1.8.3}
    container_name: dpay-temporal
    restart: unless-stopped
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--headless"]
    ports:
      - "${DPAY_PUBLISH_BIND:-127.0.0.1}:7233:7233"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "temporal operator cluster health --address 127.0.0.1:7233 >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - dpay-net

  temporal-ui:
    image: ${TEMPORAL_UI_IMAGE:-temporalio/ui:2.54.1}
    container_name: dpay-temporal-ui
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: dpay-temporal:7233
    ports:
      - "${DPAY_PUBLISH_BIND:-127.0.0.1}:${TEMPORAL_UI_PORT:-8233}:8080"
    depends_on:
      temporal:
        condition: service_healthy
    networks:
      - dpay-net

  # ── Envoy (own gateway — public 80/443) ─────────────────────────────────────
  envoy:
    image: ${ENVOY_IMAGE:-envoyproxy/envoy:v1.39.0}
    container_name: dpay-envoy
    restart: unless-stopped
    depends_on:
      - bnpl
      - identity
      - customer
      - financial-core
    volumes:
      - ./assets/dev/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./assets/dev/certs:/etc/envoy/certs:ro
    ports:
      - "80:80"
      - "443:443"
      - "${DPAY_PUBLISH_BIND:-127.0.0.1}:9901:9901"
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9901'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - dpay-net

  # ── BNPL ────────────────────────────────────────────────────────────────────
  bnpl:
    <<: *bnpl-image
    container_name: dpay-bnpl
    restart: unless-stopped
    env_file:
      - path: ./private/bnpl.env
        format: raw
    environment:
      GIN_HOST: 0.0.0.0
      GIN_PORT: "8080"
      POSTGRES_HOST: dpay-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-bnpl}
      KAFKA_BROKER_1: dpay-kafka:29092
      TASK_TEMPORAL_ADDRESS: dpay-temporal:7233
      CHECKOUT_SESSION_PUBLIC_ORIGIN: ${CHECKOUT_SESSION_PUBLIC_ORIGIN:-https://api.dev.dlend.ir}
      CHECKOUT_SESSION_PUBLIC_ORIGIN_ALLOWED_HOST: ${CHECKOUT_SESSION_PUBLIC_ORIGIN_ALLOWED_HOST:-api.dev.dlend.ir}
      SHORT_LINK_PUBLIC_HOST: ${SHORT_LINK_PUBLIC_HOST:-s.dev.dlend.ir}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      temporal:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - dpay-net

  bnpl-migrate:
    image: ${BNPL_DBADMIN_IMAGE:-registry.hamdocker.ir/parstis-technology/bnpl-backend-dbadmin:v0.1.0-development}
    container_name: dpay-bnpl-migrate
    restart: "no"
    profiles: ["migration"]
    env_file:
      - path: ./private/bnpl.env
        format: raw
    environment:
      POSTGRES_HOST: dpay-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-bnpl}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["./bnpl-dbadmin"]
    command: ["migrate", "up"]
    networks:
      - dpay-net

  # ── Identity ────────────────────────────────────────────────────────────────
  identity:
    <<: *identity-image
    container_name: dpay-identity
    restart: unless-stopped
    env_file:
      - path: ./private/identity.env
        format: raw
    environment:
      APP_MODE: api
      PARSTIS_ENVIRONMENT: dev
    read_only: true
    tmpfs: *platform-tmpfs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    expose:
      - "8080"
      - "9090"
    networks:
      - dpay-net

  identity-migrate:
    <<: *identity-image
    container_name: dpay-identity-migrate
    restart: "no"
    profiles: ["migration"]
    env_file:
      - path: ./private/identity.env
        format: raw
    environment:
      APP_MODE: migrate
      PARSTIS_ENVIRONMENT: dev
    read_only: true
    tmpfs: *platform-tmpfs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dpay-net

  identity-seed:
    <<: *identity-image
    container_name: dpay-identity-seed
    restart: "no"
    profiles: ["seed"]
    env_file:
      - path: ./private/identity.env
        format: raw
    environment:
      APP_MODE: seed
      PARSTIS_ENVIRONMENT: dev
      IDENTITY_SEED_ENABLED: "true"
      IDENTITY_SEED_BOOTSTRAP_ADMIN_ENABLED: "false"
      IDENTITY_SEED_RELEASE_ID: ${IDENTITY_SEED_RELEASE_ID:-dpay-dev}
      IDENTITY_SEED_RUN_ID: ${IDENTITY_SEED_RUN_ID:-dpay-dev-initial}
    read_only: true
    tmpfs: *platform-tmpfs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dpay-net

  identity-outbox:
    <<: *identity-image
    container_name: dpay-identity-outbox
    restart: unless-stopped
    env_file:
      - path: ./private/identity.env
        format: raw
    environment:
      APP_MODE: worker
      PARSTIS_ENVIRONMENT: dev
      IDENTITY_WORKER_COMMAND: publish-outbox
      IDENTITY_WORKER_REPEAT: "true"
      PARSTIS_JOB_INTERVAL_SECONDS: "2"
    read_only: true
    tmpfs: *platform-tmpfs
    depends_on:
      - identity
      - kafka
    networks:
      - dpay-net

  identity-revocation:
    <<: *identity-image
    container_name: dpay-identity-revocation
    restart: unless-stopped
    env_file:
      - path: ./private/identity.env
        format: raw
    environment:
      APP_MODE: worker
      PARSTIS_ENVIRONMENT: dev
      IDENTITY_WORKER_COMMAND: project-revocations-redis
      IDENTITY_WORKER_REPEAT: "true"
      PARSTIS_JOB_INTERVAL_SECONDS: "2"
    read_only: true
    tmpfs: *platform-tmpfs
    depends_on:
      - identity
      - redis
      - kafka
    networks:
      - dpay-net

  identity-notifications:
    <<: *identity-image
    container_name: dpay-identity-notifications
    restart: unless-stopped
    env_file:
      - path: ./private/identity.env
        format: raw
    environment:
      APP_MODE: worker
      PARSTIS_ENVIRONMENT: dev
      IDENTITY_WORKER_COMMAND: dispatch-authentication-notifications
      IDENTITY_WORKER_REPEAT: "true"
      PARSTIS_JOB_INTERVAL_SECONDS: "2"
    read_only: true
    tmpfs: *platform-tmpfs
    depends_on:
      - identity
      - notification
    networks:
      - dpay-net

  # ── Customer ────────────────────────────────────────────────────────────────
  customer:
    <<: *customer-image
    container_name: dpay-customer
    restart: unless-stopped
    env_file:
      - path: ./private/customer.env
        format: raw
    environment:
      APP_MODE: api
      PARSTIS_ENVIRONMENT: dev
    read_only: true
    tmpfs: *platform-tmpfs
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      identity:
        condition: service_started
    expose:
      - "8081"
      - "9091"
    networks:
      - dpay-net

  customer-migrate:
    <<: *customer-image
    container_name: dpay-customer-migrate
    restart: "no"
    profiles: ["migration"]
    env_file:
      - path: ./private/customer.env
        format: raw
    environment:
      APP_MODE: migrate
      PARSTIS_ENVIRONMENT: dev
    read_only: true
    tmpfs: *platform-tmpfs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dpay-net

  # ── Financial Core ──────────────────────────────────────────────────────────
  financial-core:
    <<: *financial-image
    container_name: dpay-financial-core
    restart: unless-stopped
    env_file:
      - path: ./private/financial-core.env
        format: raw
    environment:
      APP_MODE: api
      PARSTIS_ENVIRONMENT: dev
    read_only: true
    tmpfs: *platform-tmpfs
    volumes:
      - dpay_payment_simulator_data:/var/lib/parstis/payment-simulator
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      customer:
        condition: service_started
    expose:
      - "8082"
      - "9093"
    networks:
      - dpay-net

  financial-core-migrate:
    <<: *financial-image
    container_name: dpay-financial-core-migrate
    restart: "no"
    profiles: ["migration"]
    env_file:
      - path: ./private/financial-core.env
        format: raw
    environment:
      APP_MODE: migrate
      PARSTIS_ENVIRONMENT: dev
    read_only: true
    tmpfs: *platform-tmpfs
    volumes:
      - dpay_payment_simulator_data:/var/lib/parstis/payment-simulator
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dpay-net

  financial-outbox:
    <<: *financial-image
    container_name: dpay-financial-outbox
    restart: unless-stopped
    env_file:
      - path: ./private/financial-core.env
        format: raw
    environment:
      APP_MODE: worker
      PARSTIS_ENVIRONMENT: dev
      FINANCIAL_CORE_WORKER_MODE: loop
    read_only: true
    tmpfs: *platform-tmpfs
    volumes:
      - dpay_payment_simulator_data:/var/lib/parstis/payment-simulator
    depends_on:
      - financial-core
    networks:
      - dpay-net

  financial-provider-start:
    <<: *financial-image
    container_name: dpay-financial-provider-start
    restart: unless-stopped
    env_file:
      - path: ./private/financial-core.env
        format: raw
    environment:
      APP_MODE: provider-start-worker
      PARSTIS_ENVIRONMENT: dev
      FINANCIAL_CORE_WORKER_MODE: loop
    read_only: true
    tmpfs: *platform-tmpfs
    volumes:
      - dpay_payment_simulator_data:/var/lib/parstis/payment-simulator
    depends_on:
      - financial-core
    networks:
      - dpay-net

  financial-accounting:
    <<: *financial-image
    container_name: dpay-financial-accounting
    restart: unless-stopped
    env_file:
      - path: ./private/financial-core.env
        format: raw
    environment:
      APP_MODE: payment-accounting-worker
      PARSTIS_ENVIRONMENT: dev
      FINANCIAL_CORE_WORKER_MODE: loop
    read_only: true
    tmpfs: *platform-tmpfs
    volumes:
      - dpay_payment_simulator_data:/var/lib/parstis/payment-simulator
    depends_on:
      - financial-core
    networks:
      - dpay-net

  # ── Notification ────────────────────────────────────────────────────────────
  notification:
    <<: *notification-image
    container_name: dpay-notification
    restart: unless-stopped
    env_file:
      - path: ./private/notification.env
        format: raw
    environment:
      APP_MODE: api
      PARSTIS_ENVIRONMENT: dev
    read_only: true
    tmpfs: *platform-tmpfs
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "9092"
    networks:
      - dpay-net

  notification-migrate:
    <<: *notification-image
    container_name: dpay-notification-migrate
    restart: "no"
    profiles: ["migration"]
    env_file:
      - path: ./private/notification.env
        format: raw
    environment:
      APP_MODE: migrate
      PARSTIS_ENVIRONMENT: dev
    read_only: true
    tmpfs: *platform-tmpfs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dpay-net

  notification-dispatch:
    <<: *notification-image
    container_name: dpay-notification-dispatch
    restart: unless-stopped
    env_file:
      - path: ./private/notification.env
        format: raw
    environment:
      APP_MODE: worker
      PARSTIS_ENVIRONMENT: dev
    read_only: true
    tmpfs: *platform-tmpfs
    depends_on:
      - notification
    networks:
      - dpay-net

  notification-outbox:
    <<: *notification-image
    container_name: dpay-notification-outbox
    restart: unless-stopped
    profiles: ["notification-events"]
    env_file:
      - path: ./private/notification.env
        format: raw
    environment:
      APP_MODE: outbox
      PARSTIS_ENVIRONMENT: dev
    read_only: true
    tmpfs: *platform-tmpfs
    depends_on:
      - notification
      - kafka
    networks:
      - dpay-net

networks:
  dpay-net:
    driver: bridge
    name: dpay-net

volumes:
  dpay_postgres_data:
  dpay_redis_data:
  dpay_kafka_data:
  dpay_payment_simulator_data:
