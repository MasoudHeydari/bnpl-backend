  EXTERNAL_FINANCIAL_CORE_GRPC_INSECURE: ${EXTERNAL_FINANCIAL_CORE_GRPC_INSECURE:-true}
  EXTERNAL_NOTIFICATION_PROVIDER: ${EXTERNAL_NOTIFICATION_PROVIDER:-grpc}
  EXTERNAL_NOTIFICATION_GRPC_ADDRESS: ${EXTERNAL_NOTIFICATION_GRPC_ADDRESS:-dpay-notification:9092}
  EXTERNAL_NOTIFICATION_GRPC_INSECURE: ${EXTERNAL_NOTIFICATION_GRPC_INSECURE:-true}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  CUSTOMER_PHONE_ENCRYPTION_ACTIVE_KEY_ID: ${CUSTOMER_PHONE_ENCRYPTION_ACTIVE_KEY_ID:-}
  CUSTOMER_PHONE_ENCRYPTION_KEYS: ${CUSTOMER_PHONE_ENCRYPTION_KEYS:-}
  WEBHOOK_SECRET_ENCRYPTION_ACTIVE_KEY_ID: ${WEBHOOK_SECRET_ENCRYPTION_ACTIVE_KEY_ID:-}
  WEBHOOK_SECRET_ENCRYPTION_KEYS: ${WEBHOOK_SECRET_ENCRYPTION_KEYS:-}
  CHECKOUT_SESSION_OTP_ACTIVE_PEPPER_KEY_ID: ${CHECKOUT_SESSION_OTP_ACTIVE_PEPPER_KEY_ID:-}
  CHECKOUT_SESSION_OTP_PEPPER_KEYS: ${CHECKOUT_SESSION_OTP_PEPPER_KEYS:-}
  MERCHANT_TERMINAL_API_KEY_ACTIVE_PEPPER_KEY_ID: ${MERCHANT_TERMINAL_API_KEY_ACTIVE_PEPPER_KEY_ID:-}
  MERCHANT_TERMINAL_API_KEY_PEPPER_KEYS: ${MERCHANT_TERMINAL_API_KEY_PEPPER_KEYS:-}
  MERCHANT_TERMINAL_ISSUANCE_ENCRYPTION_ACTIVE_KEY_ID: ${MERCHANT_TERMINAL_ISSUANCE_ENCRYPTION_ACTIVE_KEY_ID:-}
  MERCHANT_TERMINAL_ISSUANCE_ENCRYPTION_KEYS: ${MERCHANT_TERMINAL_ISSUANCE_ENCRYPTION_KEYS:-}
  POLICY_ASSIGNMENT_MOBILE_HASH_ACTIVE_PEPPER_KEY_ID: ${POLICY_ASSIGNMENT_MOBILE_HASH_ACTIVE_PEPPER_KEY_ID:-}
  POLICY_ASSIGNMENT_MOBILE_HASH_PEPPER_KEYS: ${POLICY_ASSIGNMENT_MOBILE_HASH_PEPPER_KEYS:-}
  SENTRY_DSN: ${SENTRY_DSN:-}

services:
  # ── PostgreSQL (one instance, five databases) ───────────────────────────────
  postgres:
    image: ${POSTGRES_IMAGE:-docker.arvancloud.ir/postgres:18}
    container_name: dpay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bnpl}
      POSTGRES_USER: ${POSTGRES_USER:-dpay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - dpay_postgres_data:/var/lib/postgresql
      - ./assets/dev/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    ports:
      - "${DPAY_PUBLISH_BIND:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dpay} -d ${POSTGRES_DB:-bnpl}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - dpay-net

  # ── Redis (Identity revocation projection) ──────────────────────────────────
  redis:
    image: ${REDIS_IMAGE:-docker.arvancloud.ir/redis:7-alpine}
    container_name: dpay-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - dpay_redis_data:/data
    ports:
      - "${DPAY_PUBLISH_BIND:-127.0.0.1}:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - dpay-net

  # ── Kafka (KRaft single-node; internal listener for Compose DNS) ─────────────
  kafka:
    image: ${KAFKA_IMAGE:-docker.arvancloud.ir/apache/kafka:4.3.1}
    hostname: dpay-kafka
    container_name: dpay-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://dpay-kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@dpay-kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - dpay_kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      dpay-net:
        aliases:
          - dpay-kafka
          - kafka

  kafka-init:
    image: ${KAFKA_IMAGE:-docker.arvancloud.ir/apache/kafka:4.3.1}
    container_name: dpay-kafka-init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_TOPICS: >-
        ${KAFKA_TOPIC_MERCHANT_CHECKOUT_EVENTS:-bnpl.merchant.checkout.events}
        ${KAFKA_TOPIC_PAYMENT_RESULTS:-financial-core.payment-results}
        ${KAFKA_TOPIC_AUDIT_EVENTS:-bnpl.audit.events.v1}
        ${KAFKA_TOPIC_PAYMENT_APPLICATION_RESULTS:-financial_core.payment_application_results}
        ${KAFKA_TOPIC_INSTALLMENT_PAYMENT_REQUESTS:-financial_core.installment_payment_requests}
        ${KAFKA_TOPIC_INSTALLMENT_PAYMENT_RECONCILIATION_REQUESTS:-bnpl.installment_payment_reconciliation_requests}
        ${KAFKA_TOPIC_INSTALLMENT_PAYMENT_RECONCILIATION_RESULTS:-financial_core.installment_payment_reconciliation_results}
        ${KAFKA_TOPIC_INSTALLMENT_PAYMENT_RECONCILIATION_ACKNOWLEDGEMENTS:-bnpl.installment_payment_reconciliation_acknowledgements}
        ${KAFKA_TOPIC_NOTIFICATION_SMS_REQUESTS:-notification.sms.requests}
        ${KAFKA_TOPIC_IDENTITY_AUTH_REVOCATIONS:-identity.auth.revocations.v1}
        ${KAFKA_TOPIC_IDENTITY_OUTBOX:-identity.outbox.v1}
        ${KAFKA_TOPIC_NOTIFICATION_COMMANDS:-notification.commands.v1}
        ${KAFKA_TOPIC_NOTIFICATION_LIFECYCLE:-parstis.notification.lifecycle.v1}
        ${KAFKA_CONSUMER_QUARANTINE_TOPIC:-bnpl.consumer.quarantine.v1}
    volumes:
      - ./scripts/kafka/init-topics.sh:/opt/kafka/init-topics.sh:ro
    entrypoint: ["/bin/bash", "/opt/kafka/init-topics.sh"]
    networks:
      - dpay-net

  # ── Temporal (BNPL jobs) ────────────────────────────────────────────────────
  temporal:
    image: ${TEMPORAL_IMAGE:-temporalio/temporal:1.8.3}
    container_name: dpay-temporal
    restart: unless-stopped
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--headless"]
    ports:
      - "${DPAY_PUBLISH_BIND:-127.0.0.1}:7233:7233"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "temporal operator cluster health --address 127.0.0.1:7233 >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - dpay-net

  temporal-ui:
    image: ${TEMPORAL_UI_IMAGE:-temporalio/ui:2.54.1}
    container_name: dpay-temporal-ui
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: dpay-temporal:7233
    ports:
      - "${DPAY_PUBLISH_BIND:-127.0.0.1}:${TEMPORAL_UI_PORT:-8233}:8080"
    depends_on:
      temporal:
        condition: service_healthy
    networks:
      - dpay-net

  # ── Envoy (own gateway — public 80/443) ─────────────────────────────────────
  envoy:
    image: ${ENVOY_IMAGE:-envoyproxy/envoy:v1.39.0}
    container_name: dpay-envoy
    restart: unless-stopped
    depends_on:
      - bnpl
      - identity
      - customer
      - financial-core
    volumes:
      - ./assets/dev/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./assets/dev/certs:/etc/envoy/certs:ro
    ports:
      - "80:80"
      - "443:443"
      - "${DPAY_PUBLISH_BIND:-127.0.0.1}:9901:9901"
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9901'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - dpay-net

  # ── BNPL ────────────────────────────────────────────────────────────────────
  bnpl:
    <<: *bnpl-image
    container_name: dpay-bnpl
    restart: unless-stopped
    environment:
      <<: *bnpl-env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      temporal:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - dpay-net

  bnpl-migrate:
    image: ${BNPL_DBADMIN_IMAGE:-registry.hamdocker.ir/parstis-technology/bnpl-backend-dbadmin:v0.1.0-development}
    container_name: dpay-bnpl-migrate
    restart: "no"
    profiles: ["migration"]
    environment:
      <<: *bnpl-env
      CONFIG_FILE: ${BNPL_DBADMIN_CONFIG_FILE:-configs/dbadmin.yaml}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["./bnpl-dbadmin"]
    command: ["migrate", "up"]
    networks:
      - dpay-net

  # ── Identity ────────────────────────────────────────────────────────────────
  identity:
    <<: *identity-image
    container_name: dpay-identity
    restart: unless-stopped
    environment:
      <<: *identity-env
      APP_MODE: api
    read_only: true
    tmpfs: *platform-tmpfs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    expose:
      - "8080"
      - "9090"
    networks:
      - dpay-net

  identity-migrate:
    <<: *identity-image
    container_name: dpay-identity-migrate
    restart: "no"
    profiles: ["migration"]
    environment:
      <<: *identity-env
      APP_MODE: migrate
    read_only: true
    tmpfs: *platform-tmpfs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dpay-net

  identity-seed:
    <<: *identity-image
    container_name: dpay-identity-seed
    restart: "no"
    profiles: ["seed"]
    environment:
      <<: *identity-env
      APP_MODE: seed
      IDENTITY_SEED_ENABLED: "true"
      IDENTITY_SEED_BOOTSTRAP_ADMIN_ENABLED: "false"
      IDENTITY_SEED_RELEASE_ID: ${IDENTITY_SEED_RELEASE_ID:-dpay-dev}
      IDENTITY_SEED_RUN_ID: ${IDENTITY_SEED_RUN_ID:-dpay-dev-initial}
    read_only: true
    tmpfs: *platform-tmpfs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dpay-net

  identity-outbox:
    <<: *identity-image
    container_name: dpay-identity-outbox
    restart: unless-stopped
    environment:
      <<: *identity-env
      APP_MODE: worker
      IDENTITY_WORKER_COMMAND: publish-outbox
      IDENTITY_WORKER_REPEAT: "true"
      PARSTIS_JOB_INTERVAL_SECONDS: "2"
    read_only: true
    tmpfs: *platform-tmpfs
    depends_on:
      - identity
      - kafka
    networks:
      - dpay-net

  identity-revocation:
    <<: *identity-image
    container_name: dpay-identity-revocation
    restart: unless-stopped
    environment:
      <<: *identity-env
      APP_MODE: worker
      IDENTITY_WORKER_COMMAND: project-revocations-redis
      IDENTITY_WORKER_REPEAT: "true"
      PARSTIS_JOB_INTERVAL_SECONDS: "2"
    read_only: true
    tmpfs: *platform-tmpfs
    depends_on:
      - identity
      - redis
      - kafka
    networks:
      - dpay-net

  identity-notifications:
    <<: *identity-image
    container_name: dpay-identity-notifications
    restart: unless-stopped
    environment:
      <<: *identity-env
      APP_MODE: worker
      IDENTITY_WORKER_COMMAND: dispatch-authentication-notifications
      IDENTITY_WORKER_REPEAT: "true"
      PARSTIS_JOB_INTERVAL_SECONDS: "2"
    read_only: true
    tmpfs: *platform-tmpfs
    depends_on:
      - identity
      - notification
    networks:
      - dpay-net

  # ── Customer ────────────────────────────────────────────────────────────────
  customer:
    <<: *customer-image
    container_name: dpay-customer
    restart: unless-stopped
    environment:
      <<: *customer-env
      APP_MODE: api
    read_only: true
    tmpfs: *platform-tmpfs
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      identity:
        condition: service_started
    expose:
      - "8081"
      - "9091"
    networks:
      - dpay-net

  customer-migrate:
    <<: *customer-image
    container_name: dpay-customer-migrate
    restart: "no"
    profiles: ["migration"]
    environment:
      <<: *customer-env
      APP_MODE: migrate
    read_only: true
    tmpfs: *platform-tmpfs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dpay-net

  # ── Financial Core ──────────────────────────────────────────────────────────
  financial-core:
    <<: *financial-image
    container_name: dpay-financial-core
    restart: unless-stopped
    environment:
      <<: *financial-core-env
      APP_MODE: api
    read_only: true
    tmpfs: *platform-tmpfs
    volumes:
      - dpay_payment_simulator_data:/var/lib/parstis/payment-simulator
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      customer:
        condition: service_started
    expose:
      - "8082"
      - "9093"
    networks:
      - dpay-net

  financial-core-migrate:
    <<: *financial-image
    container_name: dpay-financial-core-migrate
    restart: "no"
    profiles: ["migration"]
    environment:
      <<: *financial-core-env
      APP_MODE: migrate
    read_only: true
    tmpfs: *platform-tmpfs
    volumes:
      - dpay_payment_simulator_data:/var/lib/parstis/payment-simulator
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dpay-net

  financial-outbox:
    <<: *financial-image
    container_name: dpay-financial-outbox
    restart: unless-stopped
    environment:
      <<: *financial-core-env
      APP_MODE: worker
      FINANCIAL_CORE_WORKER_MODE: loop
    read_only: true
    tmpfs: *platform-tmpfs
    volumes:
      - dpay_payment_simulator_data:/var/lib/parstis/payment-simulator
    depends_on:
      - financial-core
    networks:
      - dpay-net

  financial-provider-start:
    <<: *financial-image
    container_name: dpay-financial-provider-start
    restart: unless-stopped
    environment:
      <<: *financial-core-env
      APP_MODE: provider-start-worker
      FINANCIAL_CORE_WORKER_MODE: loop
    read_only: true
    tmpfs: *platform-tmpfs
    volumes:
      - dpay_payment_simulator_data:/var/lib/parstis/payment-simulator
    depends_on:
      - financial-core
    networks:
      - dpay-net

  financial-accounting:
    <<: *financial-image
    container_name: dpay-financial-accounting
    restart: unless-stopped
    environment:
      <<: *financial-core-env
      APP_MODE: payment-accounting-worker
      FINANCIAL_CORE_WORKER_MODE: loop
    read_only: true
    tmpfs: *platform-tmpfs
    volumes:
      - dpay_payment_simulator_data:/var/lib/parstis/payment-simulator
    depends_on:
      - financial-core
    networks:
      - dpay-net

  # ── Notification ────────────────────────────────────────────────────────────
  notification:
    <<: *notification-image
    container_name: dpay-notification
    restart: unless-stopped
    environment:
      <<: *notification-env
      APP_MODE: api
    read_only: true
    tmpfs: *platform-tmpfs
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "9092"
    networks:
      - dpay-net

  notification-migrate:
    <<: *notification-image
    container_name: dpay-notification-migrate
    restart: "no"
    profiles: ["migration"]
    environment:
      <<: *notification-env
      APP_MODE: migrate
    read_only: true
    tmpfs: *platform-tmpfs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dpay-net

  notification-dispatch:
    <<: *notification-image
    container_name: dpay-notification-dispatch
    restart: unless-stopped
    environment:
      <<: *notification-env
      APP_MODE: worker
    read_only: true
    tmpfs: *platform-tmpfs
    depends_on:
      - notification
    networks:
      - dpay-net

  notification-outbox:
    <<: *notification-image
    container_name: dpay-notification-outbox
    restart: unless-stopped
    profiles: ["notification-events"]
    environment:
      <<: *notification-env
      APP_MODE: outbox
    read_only: true
    tmpfs: *platform-tmpfs
    depends_on:
      - notification
      - kafka
    networks:
      - dpay-net

networks:
  dpay-net:
    driver: bridge
    name: dpay-net

volumes:
  dpay_postgres_data:
  dpay_redis_data:
  dpay_kafka_data:
  dpay_payment_simulator_data:
