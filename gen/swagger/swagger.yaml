basePath: /
definitions:
  checkoutsessionrs.CancelResponseSchema:
    properties:
      checkout_session_id:
        example: cs_0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        type: string
      return_url:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/model.CheckoutSessionStatus'
        enum:
        - canceled
    type: object
  checkoutsessionrs.CancelSuccessSchema:
    properties:
      data:
        $ref: '#/definitions/checkoutsessionrs.CancelResponseSchema'
      meta:
        $ref: '#/definitions/serdser.SuccessMetaNoPagination'
    type: object
  checkoutsessionrs.CheckoutActionSchema:
    properties:
      payment_amount_minor:
        type: integer
      payment_required:
        type: boolean
      type:
        allOf:
        - $ref: '#/definitions/decisionuc.CheckoutActionType'
        enum:
        - confirm_and_pay
        - confirm_purchase
    type: object
  checkoutsessionrs.CreatePartnerRequestSchema:
    properties:
      currency:
        $ref: '#/definitions/model.Currency'
      customer_phone:
        description: |-
          CustomerPhone is the merchant-asserted customer phone. Its accepted format
          is determined by MerchantProfile.Jurisdiction in Core. REST does not
          TrimSpace or apply country-specific rules; max length is a generic bound.
        example: "+989121234567"
        maxLength: 32
        type: string
      customer_reference:
        maxLength: 256
        type: string
      idempotency_key:
        description: Distinct idempotency keys allow a new attempt after a terminal
          checkout.
        maxLength: 256
        type: string
      merchant_order_id:
        maxLength: 256
        type: string
      merchant_state:
        description: MerchantState is optional opaque correlation; empty is valid.
        maxLength: 256
        type: string
      online_store_id:
        format: uuid
        type: string
      requested_amount_minor:
        minimum: 1
        type: integer
      return_destination:
        description: |-
          ReturnDestination is a pre-registered lowercase kebab-case symbolic name
          matching ^[a-z0-9]+(-[a-z0-9]+)*$ (1..64).
          NOTE: swag v1.16 does not emit a machine-readable pattern field from tags;
          the regex is documented here and enforced by Core/UseCase/DB.
        maxLength: 64
        minLength: 1
        type: string
    required:
    - currency
    - customer_phone
    - merchant_order_id
    - online_store_id
    - requested_amount_minor
    - return_destination
    type: object
  checkoutsessionrs.HostedExternalConfirmRequestSchema:
    properties:
      evaluation_generation:
        description: EvaluationGeneration is the offer version returned by GET / authorized
          by START.
        example: 1
        minimum: 1
        type: integer
      otp:
        description: OTP is the six-digit code delivered by SMS. Format is enforced
          by the use case.
        example: "123456"
        type: string
    required:
    - evaluation_generation
    - otp
    type: object
  checkoutsessionrs.HostedExternalConfirmResponseSchema:
    properties:
      checkout_session_id:
        example: cs_0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        type: string
      contract:
        $ref: '#/definitions/checkoutsessionrs.confirmContractResponse'
      evaluation_generation:
        example: 2
        type: integer
      expires_at:
        example: "2026-08-09T12:30:00Z"
        type: string
      offer:
        $ref: '#/definitions/checkoutsessionrs.hostedExternalOfferSchema'
      payment_required:
        example: true
        type: boolean
      reconfirm_required:
        example: false
        type: boolean
      redirect_url:
        example: https://pay.example/session/abc
        type: string
      status:
        allOf:
        - $ref: '#/definitions/model.CheckoutSessionStatus'
        enum:
        - open
        - confirming
        - processing
        - completed
        - canceled
        - expired
        - unavailable
    type: object
  checkoutsessionrs.HostedExternalConfirmSuccessSchema:
    properties:
      data:
        $ref: '#/definitions/checkoutsessionrs.HostedExternalConfirmResponseSchema'
      meta:
        $ref: '#/definitions/serdser.SuccessMetaNoPagination'
    type: object
  checkoutsessionrs.HostedExternalGetResponseSchema:
    properties:
      amount_minor:
        example: 120000000
        type: integer
      checkout_session_id:
        example: cs_0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        type: string
      currency:
        allOf:
        - $ref: '#/definitions/model.Currency'
        example: IRR
      evaluation_generation:
        example: 1
        type: integer
      expires_at:
        type: string
      merchant:
        $ref: '#/definitions/checkoutsessionrs.hostedExternalMerchantResponse'
      offer:
        $ref: '#/definitions/checkoutsessionrs.hostedExternalOfferSchema'
      status:
        allOf:
        - $ref: '#/definitions/model.CheckoutSessionStatus'
        enum:
        - open
        - confirming
        - processing
        - completed
        - canceled
        - expired
        - unavailable
      verification:
        $ref: '#/definitions/checkoutsessionrs.hostedExternalVerificationResponse'
    type: object
  checkoutsessionrs.HostedExternalGetSuccessSchema:
    properties:
      data:
        $ref: '#/definitions/checkoutsessionrs.HostedExternalGetResponseSchema'
      meta:
        $ref: '#/definitions/serdser.SuccessMetaNoPagination'
    type: object
  checkoutsessionrs.HostedExternalStartRequestSchema:
    properties:
      evaluation_generation:
        description: EvaluationGeneration is the offer version returned by GET, when
          known.
        example: 1
        minimum: 1
        type: integer
    type: object
  checkoutsessionrs.HostedExternalStartResponseSchema:
    properties:
      checkout_session_id:
        example: cs_0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        type: string
      evaluation_generation:
        description: EvaluationGeneration versions the offer. Send it back unchanged
          on Confirm.
        example: 1
        type: integer
      offer:
        allOf:
        - $ref: '#/definitions/checkoutsessionrs.hostedExternalOfferSchema'
        description: Offer is the financing terms bound to evaluation_generation.
      otp_expires_at:
        description: OTPExpiresAt is when the active verification code stops being
          accepted.
        type: string
      otp_sent:
        description: OTPSent is true when this call delivered a new verification code.
        example: true
        type: boolean
      status:
        allOf:
        - $ref: '#/definitions/model.CheckoutSessionStatus'
        enum:
        - open
        - unavailable
    type: object
  checkoutsessionrs.HostedExternalStartSuccessSchema:
    properties:
      data:
        $ref: '#/definitions/checkoutsessionrs.HostedExternalStartResponseSchema'
      meta:
        $ref: '#/definitions/serdser.SuccessMetaNoPagination'
    type: object
  checkoutsessionrs.OfferInstallmentSchema:
    properties:
      due_at:
        type: string
      installment_order:
        type: integer
      total_amount_minor:
        type: integer
    type: object
  checkoutsessionrs.OfferSchema:
    properties:
      approved_financed_amount_minor:
        type: integer
      available_credit_minor:
        type: integer
      checkout_action:
        $ref: '#/definitions/checkoutsessionrs.CheckoutActionSchema'
      currency:
        $ref: '#/definitions/model.Currency'
      installment_count:
        type: integer
      installments:
        items:
          $ref: '#/definitions/checkoutsessionrs.OfferInstallmentSchema'
        type: array
      offer_expires_at:
        type: string
      outcome:
        allOf:
        - $ref: '#/definitions/checkoutsessionuc.OfferOutcome'
        enum:
        - approved
        - denied
      payable_now_amount_minor:
        type: integer
      requested_amount_minor:
        type: integer
      required_down_payment_amount_minor:
        type: integer
      total_payable_amount_minor:
        type: integer
    type: object
  checkoutsessionrs.PartnerCreateResponseSchema:
    properties:
      checkout_session_id:
        description: |-
          CheckoutSessionID is the public opaque token (cs_<64 hex>), not the
          internal UUID. The JSON field name stays checkout_session_id for partners.
        example: cs_0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        type: string
      checkout_url:
        type: string
      expires_at:
        type: string
      offer:
        allOf:
        - $ref: '#/definitions/checkoutsessionrs.OfferSchema'
        description: |-
          Offer is present only when the session's snapshotted branch
          offer_preparation_mode is on_create. Omitted for on_start.
      status:
        allOf:
        - $ref: '#/definitions/model.CheckoutSessionStatus'
        enum:
        - open
        - confirming
        - processing
        - completed
        - canceled
        - expired
        - unavailable
    type: object
  checkoutsessionrs.PartnerCreateSuccessSchema:
    properties:
      data:
        $ref: '#/definitions/checkoutsessionrs.PartnerCreateResponseSchema'
      meta:
        $ref: '#/definitions/serdser.SuccessMetaNoPagination'
    type: object
  checkoutsessionrs.ReturnDestinationResponseSchema:
    properties:
      destination_name:
        type: string
      enabled:
        type: boolean
      return_url:
        type: string
    type: object
  checkoutsessionrs.ReturnDestinationSuccessSchema:
    properties:
      data:
        $ref: '#/definitions/checkoutsessionrs.ReturnDestinationResponseSchema'
      meta:
        $ref: '#/definitions/serdser.SuccessMetaNoPagination'
    type: object
  checkoutsessionrs.StatusResponseSchema:
    properties:
      amount_minor:
        example: 120000000
        type: integer
      checkout_session_id:
        example: cs_0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        type: string
      completed_at:
        type: string
      currency:
        allOf:
        - $ref: '#/definitions/model.Currency'
        example: IRR
      merchant_order_id:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/model.CheckoutSessionStatus'
        enum:
        - open
        - confirming
        - processing
        - completed
        - canceled
        - expired
        - unavailable
    type: object
  checkoutsessionrs.StatusSuccessSchema:
    properties:
      data:
        $ref: '#/definitions/checkoutsessionrs.StatusResponseSchema'
      meta:
        $ref: '#/definitions/serdser.SuccessMetaNoPagination'
    type: object
  checkoutsessionrs.UpsertReturnDestinationRequestSchema:
    properties:
      enabled:
        description: Enabled is optional. Omit to preserve the stored value (true
          on create).
        type: boolean
      return_url:
        maxLength: 2048
        type: string
    required:
    - return_url
    type: object
  checkoutsessionrs.UpsertWebhookDestinationRequestSchema:
    properties:
      enabled:
        description: Enabled is optional. Omit to preserve the stored value (true
          on create).
        type: boolean
      signing_secret:
        description: |-
          SigningSecret is write-only. Omit to keep the stored secret; send a value
          of at least 32 bytes to rotate it. Required on first registration.
        maxLength: 512
        minLength: 32
        type: string
      webhook_url:
        maxLength: 2048
        type: string
    required:
    - webhook_url
    type: object
  checkoutsessionrs.WebhookDestinationResponseSchema:
    properties:
      enabled:
        type: boolean
      webhook_url:
        type: string
    type: object
  checkoutsessionrs.WebhookDestinationSuccessSchema:
    properties:
      data:
        $ref: '#/definitions/checkoutsessionrs.WebhookDestinationResponseSchema'
      meta:
        $ref: '#/definitions/serdser.SuccessMetaNoPagination'
    type: object
  checkoutsessionrs.confirmContractResponse:
    properties:
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        format: uuid
        type: string
      status:
        allOf:
        - $ref: '#/definitions/model.ContractStatus'
        example: payment_pending
    type: object
  checkoutsessionrs.hostedExternalMerchantResponse:
    properties:
      display_name:
        example: Example Shop
        type: string
    type: object
  checkoutsessionrs.hostedExternalOfferSchema:
    properties:
      approved_financed_amount_minor:
        type: integer
      checkout_action:
        $ref: '#/definitions/checkoutsessionrs.CheckoutActionSchema'
      currency:
        $ref: '#/definitions/model.Currency'
      installment_count:
        type: integer
      installments:
        items:
          $ref: '#/definitions/checkoutsessionrs.OfferInstallmentSchema'
        type: array
      offer_expires_at:
        type: string
      outcome:
        allOf:
        - $ref: '#/definitions/checkoutsessionuc.OfferOutcome'
        enum:
        - approved
        - denied
      payable_now_amount_minor:
        type: integer
      requested_amount_minor:
        type: integer
      required_down_payment_amount_minor:
        type: integer
      total_payable_amount_minor:
        type: integer
    type: object
  checkoutsessionrs.hostedExternalVerificationResponse:
    properties:
      destination:
        example: 0912***4567
        type: string
      type:
        enum:
        - sms_otp
        example: sms_otp
        type: string
    type: object
  checkoutsessionuc.OfferOutcome:
    enum:
    - approved
    - denied
    type: string
    x-enum-varnames:
    - ApprovedOfferOutcome
    - DeniedOfferOutcome
  contractrs.CancelRequestSchema:
    properties:
      reason:
        example: customer_requested
        type: string
    type: object
  contractrs.CancelResponseSchema:
    properties:
      contract_id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        format: uuid
        type: string
      status:
        allOf:
        - $ref: '#/definitions/model.ContractStatus'
        example: canceling
    type: object
  contractrs.CancelSuccessSchema:
    properties:
      data:
        $ref: '#/definitions/contractrs.CancelResponseSchema'
      meta:
        $ref: '#/definitions/serdser.SuccessMetaNoPagination'
    type: object
  contractrs.CreateContractRequestSchema:
    type: object
  contractrs.CreateContractResponseSchema:
    properties:
      contract:
        $ref: '#/definitions/contractrs.contractResponse'
      expires_at:
        example: "2026-08-09T12:30:00Z"
        type: string
      payment_required:
        example: true
        type: boolean
      redirect_url:
        example: https://pay.example/session/abc
        type: string
      result:
        allOf:
        - $ref: '#/definitions/contractuc.CreateContractResult'
        example: created
    type: object
  contractrs.CreateContractSuccessSchema:
    properties:
      data:
        $ref: '#/definitions/contractrs.CreateContractResponseSchema'
      meta:
        $ref: '#/definitions/serdser.SuccessMetaNoPagination'
    type: object
  contractrs.contractResponse:
    properties:
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        format: uuid
        type: string
      status:
        allOf:
        - $ref: '#/definitions/model.ContractStatus'
        example: payment_pending
    type: object
  contractuc.CreateContractResult:
    enum:
    - created
    - already_exists
    type: string
    x-enum-varnames:
    - CreateContractResultCreated
    - CreateContractResultAlreadyExists
  customercreditrs.AssignInitialLimitResponseSchema:
    properties:
      credit_limit:
        $ref: '#/definitions/customercreditrs.creditLimitResponse'
      credit_limit_decision:
        $ref: '#/definitions/customercreditrs.decisionResponse'
      result:
        allOf:
        - $ref: '#/definitions/customercredituc.AssignInitialLimitResult'
        example: created
    type: object
  customercreditrs.AssignInitialLimitSuccessSchema:
    properties:
      data:
        $ref: '#/definitions/customercreditrs.AssignInitialLimitResponseSchema'
      meta:
        $ref: '#/definitions/serdser.SuccessMetaNoPagination'
    type: object
  customercreditrs.GetSuccessSchema:
    properties:
      data:
        $ref: '#/definitions/customercreditrs.creditSummaryResponse'
      meta:
        $ref: '#/definitions/serdser.SuccessMetaNoPagination'
    type: object
  customercreditrs.creditLimitDecisionOutcome:
    enum:
    - limit_set
    - denied
    type: string
    x-enum-varnames:
    - creditLimitOutcomeLimitSet
    - creditLimitOutcomeDenied
  customercreditrs.creditLimitResponse:
    properties:
      amount_minor:
        example: 90000000
        type: integer
      currency:
        allOf:
        - $ref: '#/definitions/model.Currency'
        example: IRR
      effective_from:
        example: "2026-08-09T12:00:00Z"
        type: string
      expires_at:
        example: "2027-08-09T12:00:00Z"
        type: string
      status:
        allOf:
        - $ref: '#/definitions/model.CreditAccountStatus'
        example: active
    type: object
  customercreditrs.creditSummaryResponse:
    properties:
      available_amount_minor:
        example: 4000000
        type: integer
      currency:
        allOf:
        - $ref: '#/definitions/model.Currency'
        example: IRR
      expires_at:
        example: "2027-08-09T12:00:00Z"
        type: string
      status:
        allOf:
        - $ref: '#/definitions/customercredituc.SummaryStatus'
        example: active
    type: object
  customercreditrs.decisionResponse:
    properties:
      outcome:
        allOf:
        - $ref: '#/definitions/customercreditrs.creditLimitDecisionOutcome'
        enum:
        - limit_set
        - denied
        example: limit_set
      reason_codes:
        items:
          type: string
        type: array
    type: object
  customercredituc.AssignInitialLimitResult:
    enum:
    - created
    - already_assigned
    - denied
    type: string
    x-enum-varnames:
    - AssignInitialLimitResultCreated
    - AssignInitialLimitResultAlreadyAssigned
    - AssignInitialLimitResultDenied
  customercredituc.SummaryStatus:
    enum:
    - active
    - not_assigned
    - expired
    type: string
    x-enum-varnames:
    - SummaryStatusActive
    - SummaryStatusNotAssigned
    - SummaryStatusExpired
  customerrs.ActiveContractsListSuccessSchema:
    properties:
      data:
        items:
          $ref: '#/definitions/customerrs.ContractSchema'
        type: array
      meta:
        $ref: '#/definitions/serdser.SuccessMetaKeyset'
    type: object
  customerrs.ContractSchema:
    properties:
      created_at:
        example: "2026-08-09T12:00:00Z"
        type: string
      currency:
        allOf:
        - $ref: '#/definitions/model.Currency'
        example: IRR
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        format: uuid
        type: string
      installment_count:
        example: 4
        type: integer
      merchant_branch_profile_id:
        format: uuid
        type: string
      merchant_profile_id:
        example: 8e1a2b3c-4d5e-4f6a-8b7c-9d0e1f2a3b4c
        format: uuid
        type: string
      requested_amount_minor:
        example: 150000000
        type: integer
      status:
        allOf:
        - $ref: '#/definitions/model.ContractStatus'
        enum:
        - active
        - canceling
        example: active
    type: object
  customerrs.GetResponseSchema:
    properties:
      contract_id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        format: uuid
        type: string
      created_at:
        example: "2026-08-09T12:00:00Z"
        type: string
      currency:
        allOf:
        - $ref: '#/definitions/model.Currency'
        example: IRR
      installments:
        items:
          $ref: '#/definitions/customerrs.contractInstallmentResponse'
        type: array
      next_payable_installment:
        $ref: '#/definitions/customerrs.nextPayableInstallmentResponse'
      requested_amount_minor:
        example: 150000000
        type: integer
      status:
        allOf:
        - $ref: '#/definitions/model.ContractStatus'
        enum:
        - active
        - canceling
        example: active
    type: object
  customerrs.GetSuccessSchema:
    properties:
      data:
        $ref: '#/definitions/customerrs.GetResponseSchema'
      meta:
        $ref: '#/definitions/serdser.SuccessMetaNoPagination'
    type: object
  customerrs.PaymentSchema:
    properties:
      amount_minor:
        example: 25000000
        type: integer
      completed_at:
        example: "2026-08-09T12:05:00Z"
        type: string
      contract_id:
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        format: uuid
        type: string
      created_at:
        example: "2026-08-09T12:00:00Z"
        type: string
      currency:
        allOf:
        - $ref: '#/definitions/model.Currency'
        example: IRR
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        format: uuid
        type: string
      installment_id:
        example: 0a1b2c3d-4e5f-6789-abcd-ef0123456789
        format: uuid
        type: string
      purpose:
        allOf:
        - $ref: '#/definitions/customerrs.publicPaymentPurpose'
        enum:
        - first_installment
        - installment
        example: installment
      status:
        allOf:
        - $ref: '#/definitions/customerrs.publicPaymentStatus'
        enum:
        - succeeded
        - failed
        - canceled
        example: succeeded
    type: object
  customerrs.PaymentsListSuccessSchema:
    properties:
      data:
        items:
          $ref: '#/definitions/customerrs.PaymentSchema'
        type: array
      meta:
        $ref: '#/definitions/serdser.SuccessMetaKeyset'
    type: object
  customerrs.UnpaidInstallmentSchema:
    properties:
      contract_id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        format: uuid
        type: string
      currency:
        allOf:
        - $ref: '#/definitions/model.Currency'
        example: IRR
      due_at:
        example: "2026-09-09T12:00:00Z"
        type: string
      id:
        example: 0a1b2c3d-4e5f-6789-abcd-ef0123456789
        format: uuid
        type: string
      installment_order:
        example: 2
        type: integer
      merchant_branch_profile_id:
        format: uuid
        type: string
      merchant_profile_id:
        example: 8e1a2b3c-4d5e-4f6a-8b7c-9d0e1f2a3b4c
        format: uuid
        type: string
      paid_at:
        type: string
      status:
        allOf:
        - $ref: '#/definitions/model.InstallmentStatus'
        enum:
        - scheduled
        - due
        - overdue
        example: due
      total_amount_minor:
        example: 25000000
        type: integer
    type: object
  customerrs.UnpaidInstallmentsListSuccessSchema:
    properties:
      data:
        items:
          $ref: '#/definitions/customerrs.UnpaidInstallmentSchema'
        type: array
      meta:
        $ref: '#/definitions/serdser.SuccessMetaKeyset'
    type: object
  customerrs.contractInstallmentResponse:
    properties:
      currency:
        allOf:
        - $ref: '#/definitions/model.Currency'
        example: IRR
      due_at:
        example: "2026-08-09T12:00:00Z"
        type: string
      id:
        example: 0a1b2c3d-4e5f-6789-abcd-ef0123456789
        format: uuid
        type: string
      installment_order:
        example: 1
        type: integer
      paid_at:
        example: "2026-08-09T12:05:00Z"
        type: string
      status:
        allOf:
        - $ref: '#/definitions/model.InstallmentStatus'
        example: paid
      total_amount_minor:
        example: 75000000
        type: integer
    type: object
  customerrs.nextPayableInstallmentResponse:
    properties:
      currency:
        allOf:
        - $ref: '#/definitions/model.Currency'
        example: IRR
      due_at:
        example: "2026-09-09T12:00:00Z"
        type: string
      id:
        example: 1b2c3d4e-5f67-8901-bcde-f01234567890
        format: uuid
        type: string
      installment_order:
        example: 2
        type: integer
      payable_amount_minor:
        example: 25000000
        type: integer
      status:
        allOf:
        - $ref: '#/definitions/model.InstallmentStatus'
        example: due
    type: object
  customerrs.publicPaymentPurpose:
    enum:
    - first_installment
    - installment
    type: string
    x-enum-varnames:
    - publicPurposeFirstInstallment
    - publicPurposeInstallment
  customerrs.publicPaymentStatus:
    enum:
    - succeeded
    - failed
    - canceled
    type: string
    x-enum-varnames:
