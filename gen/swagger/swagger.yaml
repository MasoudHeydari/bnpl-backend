  /api/v1/customer-credit:
    get:
      description: |-
        Returns the authenticated customer's current BNPL credit summary.
        x-auth-subject-id is the stable Identity Service subject ID (customer_profiles.external_customer_id), not the internal BNPL profile primary key.
        BNPL resolves or provisions the local customer profile automatically when missing. Profile provisioning is idempotent and does not assign initial credit.
        Requires only an authenticated customer subject; no BNPL profile eligibility or credit limit precondition applies.
        No request body.
        Available credit = effective current credit limit minus active committed financed exposure.
        Active financed exposure is persisted on the customer CreditAccount as outstanding principal from activated contracts.
        Checkout decisions, installment offers, and pre-activation contracts (payment_pending) do not reduce available credit.
        Credit is consumed only when a contract becomes active under its persisted checkout policy.
        When no credit limit has been assigned (customer never assessed), data contains only status not_assigned and meta.code is CUSTOMER_CREDIT_NOT_ASSIGNED — clients must initiate credit assessment, not treat this as a zero balance.
        When a historical limit exists but is not currently usable (including time-expired), data contains only status expired and expires_at; meta.code is CUSTOMER_CREDIT_EXPIRED — clients must trigger reassessment.
        For an active limit, available_amount_minor is an integer minor-unit amount in the response currency.
      parameters:
      - description: Stable authenticated subject identifier issued by Identity Service
          (customer_profiles.external_customer_id)
        format: uuid
        in: header
        name: x-auth-subject-id
        required: true
        type: string
