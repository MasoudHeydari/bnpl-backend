securityDefinitions:
  PermissionAuth:
    description: Comma-separated gateway permissions. Protected endpoints also require
      x-auth-subject-id, x-auth-tenant-id, and x-auth-context-id.
    in: header
    name: x-auth-permissions
    type: apiKey
  TerminalAPIKey:
    description: Secret API key of an external partner terminal. Sent together with
      X-Terminal-Id on /api/v1/partner endpoints. Never logged.
    in: header
    name: X-API-Key
    type: apiKey
  TerminalID:
    description: Public numeric terminal identifier of an external partner. Sent together
      with X-API-Key on /api/v1/partner endpoints.
    in: header
    name: X-Terminal-Id
    type: apiKey
swagger: "2.0"
