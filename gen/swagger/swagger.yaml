  /api/v1/partner/return-destinations/{destination_name}:
    put:
      consumes:
      - application/json
      description: |-
        Registers or updates a symbolic browser-return destination for the authenticated merchant.
        destination_name must match ^[a-z0-9]+(-[a-z0-9]+)*$ and be 1..64 characters (lowercase kebab-case).
        Checkout create selects destinations by name only; arbitrary return URLs are never accepted on checkout requests.
        Production requires https return_url; development/test may use http only for localhost/loopback.
        Leading or trailing whitespace in return_url is rejected (not trimmed).
        enabled is optional: omit it to preserve the stored value (true on first registration).
        Requires the dedicated bnpl:checkout-return-destinations:manage:merchant permission.
