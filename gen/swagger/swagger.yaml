  contact: {}
  description: |-
    HTTP API for the BNPL backend service.
    The committed Swagger document is a Swagger 2.0 specification generated by Swaggo.
    Business endpoints under /api/v1 require API Gateway auth headers, except /api/v1/partner endpoints, which authenticate Merchant identity with X-Terminal-Id and X-API-Key. Partner Create Checkout additionally consumes Gateway-injected X-Auth-Tenant-Id and X-Auth-Context-Id (not merchant-selected; not request-body fields). Gateway SubjectID/Permissions do not control Partner Merchant identity. Health probes are public.
  title: BNPL Backend API
  version: "1.0"
paths:
  /api/v1/checkout-decisions:
    post:
      consumes:
      - application/json
      description: |-
        Evaluates checkout feasibility for a customer/merchant pair and persists a decision.
        x-auth-subject-id is the stable Identity Service subject ID (customer_profiles.external_customer_id). Do not send customer_id in the body.
        purchase_context.type must be "pos" or "online"; the channel is explicit and is never inferred from optional fields.
        For type=pos, purchase_context.pos_gps_id is required; online_store_id and merchant_order_id are forbidden.
        For type=online, purchase_context.online_store_id is required; pos_gps_id is forbidden; merchant_order_id is optional (max 256 characters).
        Malformed purchase_context combinations are rejected with HTTP 400 before the use case runs.
        BNPL resolves the selling point and merchant from the supplied source identifier; do not send merchant_profile_id or branch_id.
        Requires an authenticated customer subject, an eligible customer profile, and an active credit limit.
        An approved (including domain conditional / partial financing) checkout Decision atomically creates and returns the persisted installment offer
        (installment IDs, status, order, due date, principal, upfront, fees, totals, payable-now, and total payable).
        For policies anchored to contract_activation, offered due dates are provisional; installment economics stay fixed and due dates are finalized from the successful activation instant.
        checkout_action tells the client how to confirm the offer: confirm_and_pay requires the returned initial payment; confirm_purchase creates the contract without an initial payment.
        Frontend clients should drive the checkout button from checkout_action, not from policy version or purchase channel.
        The HTTP response outcome is always "approved" or "denied"; persisted conditional outcomes are mapped to "approved".
        Denied decisions return reason codes and omit installment_offer; no installment records are created.
        Approval means the customer had enough available credit at evaluation time (limit minus active exposure).
        Does not reserve or reduce available credit; final capacity is checked again at contract activation.
        Idempotent via Idempotency-Key (checkout_intent_id / checkout key). Returns 201 on create and 200 on idempotent replay
        with the same Decision and persisted installments (no duplicates).
      parameters:
      - description: Stable authenticated subject identifier issued by Identity Service
          (customer_profiles.external_customer_id)
        format: uuid
        in: header
        name: x-auth-subject-id
        required: true
        type: string
      - description: Authenticated tenant UUID
        format: uuid
        in: header
        name: x-auth-tenant-id
        required: true
        type: string
      - description: Authenticated business-context UUID
        format: uuid
        in: header
        name: x-auth-context-id
        required: true
        type: string
      - description: Comma-separated gateway permissions
        example: bnpl:decisions:create:self
        in: header
        name: x-auth-permissions
        required: true
        type: string
      - description: Client idempotency token used as the checkout key (max 256 characters)
        in: header
        name: Idempotency-Key
        required: true
        type: string
      - description: Optional; reused when present otherwise generated. Always returned.
        in: header
