  /api/v1/checkout-decisions/{decision_id}/contracts:
    post:
      consumes:
      - application/json
      description: |-
        Creates a checkout contract according to the policy snapshot stored on the Decision. When customer action is required, returns redirect_url and expires_at; merchant-funding policies return payment_required=false.
        x-auth-subject-id is the stable Identity Service subject ID (customer_profiles.external_customer_id). Do not send customer_id or payment provider selection in the body.
        Installment schedule details are not returned from this endpoint; use contract installment read APIs when needed.
        For initial-payment policies activation occurs only after an authoritative payment result. Merchant-funding policies create no PaymentAttempt and activate only after authoritative Financial Core merchant funding.
        Merchant funding records MerchantEntitlement synchronously before the contract becomes active. On recognition failure BNPL does not retry in the background; the caller may retry the same contract request.
        Idempotent on decision: returns 201 on create and 200 when a contract already exists.
        Public response never includes Financial Core payment identifiers.
