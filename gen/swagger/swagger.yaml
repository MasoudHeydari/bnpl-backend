  /api/v1/payments:
    get:
      description: |-
        Returns finalized installment payment attempts owned by the authenticated customer.
        x-auth-subject-id is the stable Identity Service subject ID (customer_profiles.external_customer_id). Do not send customer identity in path or query.
        Only payment attempts in states succeeded, failed, or canceled are returned.
        In-progress and operational states (created, submitted, reconciliation_required, manual_review_required) are excluded and never mapped to another public status.
        Includes purposes checkout_first_installment (first_installment) and installment_repayment (installment).
        Multiple finalized attempts for the same installment remain visible as separate rows.
        Newest attempts first (created_at DESC, id DESC). Empty list is 200, not 404.
        amount_minor is an integer minor-unit monetary value in the response currency.
        completed_at is state-specific when present: succeeded uses applied_at, failed uses failed_at, canceled uses canceled_at; otherwise null.
        Raw provider, reconciliation, and gateway failure details are not exposed.
        Keyset pagination via limit, after_id, and after_created_at.
      parameters:
      - description: Stable authenticated subject identifier issued by Identity Service
          (customer_profiles.external_customer_id)
        format: uuid
        in: header
        name: x-auth-subject-id
        required: true
        type: string
      - description: Authenticated tenant UUID
        format: uuid
        in: header
        name: x-auth-tenant-id
        required: true
        type: string
      - description: Authenticated business-context UUID
        format: uuid
        in: header
        name: x-auth-context-id
        required: true
        type: string
      - description: Comma-separated gateway permissions
        example: bnpl:payments:read:self
        in: header
        name: x-auth-permissions
        required: true
        type: string
      - description: Optional; reused when present otherwise generated. Always returned.
        in: header
        name: X-Trace-Id
        type: string
      - description: Optional; reused when present otherwise generated. Always returned.
        in: header
        name: X-Request-Id
        type: string
      - description: Optional; reused when present otherwise generated. Always returned.
        in: header
        name: X-Correlation-Id
        type: string
      - description: Page size (default 20, max 100)
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: 'Keyset cursor: last payment id from previous page'
        format: uuid
        in: query
        name: after_id
        type: string
      - description: 'Keyset cursor: last payment created_at (RFC3339Nano) from previous
          page'
        in: query
        name: after_created_at
        type: string
      - description: Sort order; always applied as desc for this endpoint
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Installment payment history listed
