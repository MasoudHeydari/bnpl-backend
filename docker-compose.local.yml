# Local development Docker Compose (includes Loki / Promtail / Grafana).
#
# Usage:
#   cp .env.example .env
#   make up
#   make build && make init-dev && ./build/bin/bnpl
#
# `make up` creates the Grafana password secret and log dirs when missing.
#
# Local endpoints:
#   BNPL:              http://127.0.0.1:8080
#   Envoy Gateway:     http://127.0.0.1:8088
#   Envoy Admin:       http://127.0.0.1:9901
#   Redpanda Console:  http://127.0.0.1:8081
#   Temporal UI:       http://127.0.0.1:${TEMPORAL_UI_PORT:-8233}
#   Loki:              http://127.0.0.1:3100
#   Promtail:          http://127.0.0.1:3101
#   Grafana:           http://127.0.0.1:${GRAFANA_PORT:-3001}
#
# Loki configs live under assets/local-development/{loki,promtail,grafana,secrets,logs}.
# Loki has no authentication. Bind is loopback-only. Test/local only.
#
# Credentials come from .env (gitignored). Grafana admin password is the Docker
# secret file assets/local-development/secrets/bnpl_loki_grafana_password.
# The BNPL application runs on the host, not inside Compose.

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: docker.arvancloud.ir/postgres:18
    container_name: bnpl-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data_bnpl:/var/lib/postgresql

    ports:
      - "127.0.0.1:5432:5432"

    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
      ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - bnpl-net

  # ── Kafka ──────────────────────────────────────────────────────────────────
  #
  # Official apache/kafka image (KRaft). Env vars must use the KAFKA_* form.
  kafka:
    image: docker.arvancloud.ir/apache/kafka:4.3.1
    hostname: kafka
    container_name: bnpl-kafka
    restart: unless-stopped

    environment:
      # Run a single-node Kafka cluster in KRaft combined mode.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

      # EXTERNAL is used by applications running on the host.
      # INTERNAL is used by containers on bnpl-net, such as Redpanda Console.
      # CONTROLLER is used only by Kafka's KRaft controller.
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093

      # Host-side clients connect through localhost:9092.
      # Docker services connect through kafka:29092.
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      # Broker-to-broker communication uses the internal Docker listener.
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Single-node KRaft controller configuration.
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Internal Kafka topics cannot use the production default replication
      # factor because this local environment has only one broker.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - kafka_data_bnpl:/var/lib/kafka/data

    ports:
      # Only the external listener needs to be accessible from the host.
      - "127.0.0.1:9092:9092"

    healthcheck:
      test: [
        "CMD-SHELL",
        "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"
      ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

    networks:
      - bnpl-net

  # ── Local Kafka topic initialization ───────────────────────────────────────
  #
  # One-shot, idempotent provisioning for the single-broker development setup.
  # Requires ./scripts/kafka/init-topics.sh on the host (not shipped here).
  kafka-init:
    image: docker.arvancloud.ir/apache/kafka:4.3.1
    container_name: bnpl-kafka-init
    restart: "no"

    depends_on:
      kafka:
        condition: service_healthy

    environment:
      # Include both producer destinations and consumer subscriptions. The
      # script deduplicates names when the consumer and producer topics match.
      KAFKA_TOPICS: >-
        ${KAFKA_TOPIC_MERCHANT_CHECKOUT_EVENTS:-bnpl.merchant.checkout.events}
        ${KAFKA_TOPIC_PAYMENT_RESULTS:-financial-core.payment-results}
        ${KAFKA_TOPIC_AUDIT_EVENTS:-bnpl.audit.events.v1}
        ${KAFKA_TOPIC_PAYMENT_APPLICATION_RESULTS:-financial_core.payment_application_results}
        ${KAFKA_TOPIC_INSTALLMENT_PAYMENT_REQUESTS:-financial_core.installment_payment_requests}
        ${KAFKA_TOPIC_INSTALLMENT_PAYMENT_RECONCILIATION_REQUESTS:-bnpl.installment_payment_reconciliation_requests}
        ${KAFKA_TOPIC_INSTALLMENT_PAYMENT_RECONCILIATION_RESULTS:-financial_core.installment_payment_reconciliation_results}
        ${KAFKA_TOPIC_INSTALLMENT_PAYMENT_RECONCILIATION_ACKNOWLEDGEMENTS:-bnpl.installment_payment_reconciliation_acknowledgements}
        ${KAFKA_TOPIC_NOTIFICATION_SMS_REQUESTS:-notification.sms.requests}
        ${KAFKA_TOPIC_DOCUMENT_LIFECYCLE:-document.lifecycle}
        ${KAFKA_TOPIC_DOCUMENT_OWNER_LIFECYCLE:-document.owner.lifecycle}
        ${KAFKA_TOPIC_FINANCIAL_EVENTS:-financial.events}
        ${KAFKA_TOPIC_FINANCIAL_PROVIDER_COMMANDS:-financial.provider.commands}
        ${KAFKA_TOPIC_IDENTITY_AUTH_REVOCATIONS:-identity.auth.revocations.v1}
        ${KAFKA_TOPIC_IDENTITY_OUTBOX:-identity.outbox.v1}
        ${KAFKA_TOPIC_NOTIFICATION_COMMANDS:-notification.commands.v1}
        ${KAFKA_TOPIC_NOTIFICATION_LIFECYCLE:-parstis.notification.lifecycle.v1}
        ${KAFKA_CONSUMER_QUARANTINE_TOPIC:-bnpl.consumer.quarantine.v1}
        ${KAFKA_CONSUMER_TOPIC_PAYMENT_RESULTS:-financial-core.payment-results}
        ${KAFKA_CONSUMER_TOPIC_INSTALLMENT_PAYMENT_RECONCILIATION_RESULTS:-financial_core.installment_payment_reconciliation_results}

    volumes:
      - ./scripts/kafka/init-topics.sh:/opt/kafka/init-topics.sh:ro

    entrypoint:
      - /bin/bash
      - /opt/kafka/init-topics.sh

    networks:
      - bnpl-net

  # ── Redpanda Console ───────────────────────────────────────────────────────
  #
  # Redpanda Console is only a Kafka UI in this setup.
  # Open: http://127.0.0.1:8081
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.9.0
    container_name: bnpl-redpanda-console
    restart: unless-stopped

    environment:
      # Use Kafka's internal Docker listener.
      KAFKA_BROKERS: kafka:29092

    ports:
      # Port 8080 is reserved for the host-side BNPL application.
      - "127.0.0.1:8081:8080"

    depends_on:
      kafka:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - bnpl-net

  # ── Temporal development server ────────────────────────────────────────────
  #
  # Single-process development server for test only.
  temporal:
    image: temporalio/temporal:1.8.3
    container_name: bnpl-temporal
    restart: unless-stopped

    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      # The standalone temporal-ui service below owns the local Web UI.
      - --headless

    ports:
      - "127.0.0.1:7233:7233"

    healthcheck:
      test: [
        "CMD-SHELL",
        "temporal operator cluster health --address 127.0.0.1:7233 >/dev/null 2>&1 || exit 1"
      ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

    networks:
      - bnpl-net

  # ── Temporal Web UI ───────────────────────────────────────────────────────
  #
  # Open: http://127.0.0.1:${TEMPORAL_UI_PORT}
  temporal-ui:
    image: temporalio/ui:2.54.1
    container_name: bnpl-temporal-ui
    restart: unless-stopped

    environment:
      TEMPORAL_ADDRESS: temporal:7233

    ports:
      - "127.0.0.1:${TEMPORAL_UI_PORT}:8080"

    depends_on:
      temporal:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - bnpl-net

  # ── Envoy Gateway ──────────────────────────────────────────────────────────
  #
  # Envoy runs in the host network namespace because BNPL itself runs
  # directly on the host and listens only on 127.0.0.1:8080.
  #
  # Requires local Envoy config + certs (not shipped in this pack).
  envoy:
    image: envoyproxy/envoy:v1.39.0
    container_name: bnpl-envoy
    restart: unless-stopped

    network_mode: host

    volumes:
      - ./assets/local-development/envoy/development/config.yaml:/etc/envoy/envoy.yaml:ro
      # Replace this host path on the target machine with the real certs directory.
      - /home/masoud-dev/Documents/projects/golang/platform-infra/envoy/certs:/etc/envoy/certs:ro

    command:
      - envoy
      - -c
      - /etc/envoy/envoy.yaml
      - --log-level
      - info

    # Envoy image has no wget; TCP to admin port is the portable ready signal.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9901'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Loki (log store) ───────────────────────────────────────────────────────
  #
  # Test single-binary Loki with filesystem TSDB. Retention TTL 744h.
  # No auth. Loopback bind only. Not HA / not production.
  loki:
    image: docker.arvancloud.ir/grafana/loki:3.6.8
    container_name: bnpl-loki
    restart: unless-stopped

    command:
      - -config.file=/etc/loki/local-config.yaml

    volumes:
      - ./assets/local-development/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki

    ports:
      - "127.0.0.1:3100:3100"

    # Distroless image: no shell/wget. Binary check + start_period covers boot.
    # Orchestrators with HTTP probes should hit GET /ready on :3100 instead.
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-version"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - bnpl-net

  # ── Promtail (collector) ───────────────────────────────────────────────────
  #
  # Pushes to http://loki:3100/loki/api/v1/push
  # Host app logs: per-service *_LOG_DIR -> /host-logs/<service> (read-only)
  # Docker logs: explicit opt-in and per-service *_LOG_SOURCE=docker
  # HTTP listen 3101 reserved for ready/metrics (optional future receiver not activated)
  promtail:
    image: docker.arvancloud.ir/grafana/promtail:3.6.8
    container_name: bnpl-promtail
    restart: unless-stopped

    command:
      - -config.file=/etc/promtail/config.yml
      - -config.expand-env=true

    environment:
      IDENTITY_LOG_SOURCE: ${IDENTITY_LOG_SOURCE:-host}
      MERCHANT_LOG_SOURCE: ${MERCHANT_LOG_SOURCE:-host}
      LOCATION_LOG_SOURCE: ${LOCATION_LOG_SOURCE:-host}
      BNPL_LOG_SOURCE: ${BNPL_LOG_SOURCE:-host}
      DOCUMENT_LOG_SOURCE: ${DOCUMENT_LOG_SOURCE:-host}
      FINANCIAL_CORE_LOG_SOURCE: ${FINANCIAL_CORE_LOG_SOURCE:-host}
      CUSTOMER_LOG_SOURCE: ${CUSTOMER_LOG_SOURCE:-host}
      NOTIFICATION_LOG_SOURCE: ${NOTIFICATION_LOG_SOURCE:-host}

    volumes:
      - ./assets/local-development/promtail/config.yml:/etc/promtail/config.yml:ro
      - bnpl_loki_positions:/var/lib/promtail
      - ${IDENTITY_LOG_DIR:-./assets/local-development/logs/identity-service}:/host-logs/identity-service:ro
      - ${MERCHANT_LOG_DIR:-./assets/local-development/logs/merchant-service}:/host-logs/merchant-service:ro
      - ${LOCATION_LOG_DIR:-./assets/local-development/logs/location-service}:/host-logs/location-service:ro
      - ${BNPL_LOG_DIR:-./assets/local-development/logs/bnpl-service}:/host-logs/bnpl-service:ro
      - ${DOCUMENT_LOG_DIR:-./assets/local-development/logs/document-service}:/host-logs/document-service:ro
      - ${FINANCIAL_CORE_LOG_DIR:-./assets/local-development/logs/financial-core-service}:/host-logs/financial-core-service:ro
      - ${CUSTOMER_LOG_DIR:-./assets/local-development/logs/customer-service}:/host-logs/customer-service:ro
      - ${NOTIFICATION_LOG_DIR:-./assets/local-development/logs/notification-service}:/host-logs/notification-service:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    ports:
      - "127.0.0.1:3101:3101"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      loki:
        condition: service_healthy

    # Ubuntu base: no wget packaged. TCP open on HTTP listen port ≈ ready.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3101'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - bnpl-net

  # ── Grafana (Explore Loki) ─────────────────────────────────────────────────
  #
  # Open: http://127.0.0.1:${GRAFANA_PORT:-3001}
  # Admin password from Docker secret file secrets/bnpl_loki_grafana_password
  grafana:
    image: docker.arvancloud.ir/grafana/grafana:12.3.0
    container_name: bnpl-grafana
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/bnpl_loki_grafana_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_SERVER_ROOT_URL: http://127.0.0.1:${GRAFANA_PORT:-3001}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"

    volumes:
      - ./assets/local-development/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana

    # Grafana runs as UID 472. Compose file-backed secrets inherit host mode
    # bits (uid/gid/mode are ignored on this engine), so `make up` keeps the
    # secret file mode 0644 for the grafana user to read.
    secrets:
      - bnpl_loki_grafana_password

    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"

    depends_on:
      loki:
        condition: service_healthy

    healthcheck:
      test: [
        "CMD-SHELL",
        "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1",
      ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - bnpl-net

networks:
  bnpl-net:
    driver: bridge

volumes:
  postgres_data_bnpl:
  kafka_data_bnpl:
  loki_data:
  bnpl_loki_positions:
  grafana_data:

secrets:
  bnpl_loki_grafana_password:
    file: ./assets/local-development/secrets/bnpl_loki_grafana_password
