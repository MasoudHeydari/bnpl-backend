application: dbadmin

runtime:
  environment: ${APP_ENVIRONMENT}

database:
  host: ${POSTGRES_HOST}
  port: ${POSTGRES_PORT}
  name: ${POSTGRES_DB}
  ssl_mode: ${POSTGRES_SSL_MODE}
  max_connections: ${DBADMIN_POSTGRES_MAX_CONNECTIONS}
  min_connections: ${DBADMIN_POSTGRES_MIN_CONNECTIONS}
  max_connection_life_time: ${DBADMIN_POSTGRES_MAX_CONNECTION_LIFE_TIME}
  max_connection_idle_time: ${DBADMIN_POSTGRES_MAX_CONNECTION_IDLE_TIME}
  health_check_period: ${DBADMIN_POSTGRES_HEALTH_CHECK_PERIOD}
  connection_timeout: ${DBADMIN_POSTGRES_CONNECTION_TIMEOUT}
  pgpass_entries:
    admin: ${POSTGRES_ADMIN_PGPASS}
    migrator: ${POSTGRES_MIGRATOR_PGPASS}

provisioning:
  normal_password: ${POSTGRES_PROVISION_NORMAL_PASSWORD}

migration:
  files-dir: ${MIGRATIONS_FILES_DIR}
  lock_timeout: ${MIGRATIONS_LOCK_TIMEOUT}

logging:
  format: ${DBADMIN_LOG_FORMAT}

versions:
  # semantic version of the database schema
  database: 0.2.0
  # semantic version of the configuration file itself
  config: 0.3.0
