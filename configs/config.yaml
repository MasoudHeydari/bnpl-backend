database:
  host: 127.0.0.1
  port: 5432
  name: bnpl_db
  max_connections: 10
  min_connections: 1
  max_connection_life_time: 3600s
  max_connection_idle_time: 1800s
  health_check_period: 60s
  connection_timeout: 30s
  pass-dir: dist/.db

gin:
  host: 127.0.0.1
  port: 8000
  mode: debug
  logger: true
  recovery: true

usecases:
  migration:
    files-dir: assets/db/migrations

versions:
  # semantic version of the database schema
  database: 0.1.0
  # semantic version of the configuration file itself
  config: 0.1.0
