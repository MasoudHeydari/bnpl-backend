name: CD

on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]
    branches: [ main ]
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write   # push to GitHub Container Registry

jobs:
  # ── 1. BUILD & PUSH IMAGE ─────────────────────────────────────────────────
  build-and-push:
    name: Build & push image
    # Run if triggered by a tag push, OR if CI succeeded on main.
    if: |
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      # Pass the exact SHA to downstream jobs so they always deploy what CI tested.
      sha: ${{ steps.meta.outputs.sha }}
      image: ${{ steps.meta.outputs.image }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Export immutable deploy coordinates
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            SHA="${{ github.sha }}"
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
          fi
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "sha=${SHA}"          >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${REPO}" >> "$GITHUB_OUTPUT"

      # Check out the exact commit that CI tested (or the tagged commit).
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      # ── ghcr.io ────────────────────────────────────────────────────────────
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Computes tags: SHA always; semver tags (v1.2.3 -> 1.2.3, 1.2, 1)
      # only when triggered by a `v*.*.*` git tag push.
      - name: Compute GHCR tags
        id: ghcr_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.image }}
          tags: |
            type=raw,value=${{ steps.meta.outputs.sha }}
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Tag with the immutable SHA (used for deploy) AND latest (for reference only).
          # NEVER deploy the `latest` tag directly — always deploy by SHA.
          tags: ${{ steps.ghcr_meta.outputs.tags }}
          labels: ${{ steps.ghcr_meta.outputs.labels }}
          # Re-use layer cache across runs to keep build times short.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Hamravesh Container Registry ────────────────────────────────────────
      - name: Log in to Hamravesh Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.hamdocker.ir
          username: ${{ secrets.HAMRAVESH_REGISTRY_USERNAME }}
          password: ${{ secrets.HAMRAVESH_REGISTRY_PASSWORD }}

      - name: Compute Hamravesh tags
        id: hamravesh_meta
        uses: docker/metadata-action@v5
        with:
          images: registry.hamdocker.ir/parstis-technology/bnpl-backend
          tags: |
            type=raw,value=${{ steps.meta.outputs.sha }}
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

  # ── 2. DEPLOY TO PRODUCTION ───────────────────────────────────────────────
  deploy:
    name: Deploy to production
    needs: build-and-push
    if: github.event_name != 'push' || github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # GitHub Environment: configure required reviewers in Settings → Environments → production.
    # The job pauses here until an authorized person approves in the GitHub UI.
    environment: production

    steps:
      # Sync the deploy script to the server so it's always the version from this commit.
      # The script is version-controlled in scripts/deploy.sh.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-and-push.outputs.sha }}
          sparse-checkout: scripts/deploy.sh
          sparse-checkout-cone-mode: false

      - name: Deploy via SSH
        env:
          # Secrets — referenced via env: so GitHub masks them in logs.
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOST: ${{ secrets.PROD_SSH_KNOWN_HOST }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          # Non-secret deploy coordinates.
          IMAGE_TAG: ${{ needs.build-and-push.outputs.sha }}
          IMAGE_BASE: ${{ needs.build-and-push.outputs.image }}
        run: |
          # ── SSH setup ──────────────────────────────────────────────────────
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Known-host fingerprint prevents MITM; obtain once with:
          #   ssh-keyscan -H "$PROD_SSH_HOST" 2>/dev/null
          echo "$SSH_KNOWN_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          KEY_FILE=$(mktemp)
          chmod 600 "$KEY_FILE"
          # Write key without echoing it; printf avoids a trailing newline issue.
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_FILE"

          SSH_OPTS="-i $KEY_FILE -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -p ${SSH_PORT:-22}"

          # ── Upload latest deploy script ────────────────────────────────────
          scp $SSH_OPTS scripts/deploy.sh \
            "${SSH_USER}@${SSH_HOST}:/opt/bnpl/scripts/deploy.sh"
          ssh $SSH_OPTS "${SSH_USER}@${SSH_HOST}" \
            "chmod +x /opt/bnpl/scripts/deploy.sh"

          # ── Run deployment ─────────────────────────────────────────────────
          # Only the image tag and base URL are transmitted — zero production
          # secrets cross the wire at this point.
          ssh $SSH_OPTS "${SSH_USER}@${SSH_HOST}" \
            "bash /opt/bnpl/scripts/deploy.sh '${IMAGE_TAG}' '${IMAGE_BASE}'"

          rm -f "$KEY_FILE"

      - name: Deployment summary
        if: success()
        run: |
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | \`${{ needs.build-and-push.outputs.image }}:${{ needs.build-and-push.outputs.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ needs.build-and-push.outputs.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
