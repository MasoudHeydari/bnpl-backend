# dpay / Hamravesh-dev Envoy gateway (self-hosted).
#
# Public host: ${DEV_PUBLIC_HOST:-dev.dlend.ir} (TLS SAN must include this name).
# Upstream targets use Compose DNS names on dpay-net — never host IPs.
#
# TLS material is expected at:
#   /etc/envoy/certs/tls.crt
#   /etc/envoy/certs/tls.key
#
# This is a pragmatic routing skeleton for the unified Compose stack.
# JWT / Lua / merchant-guest filters from the local platform gateway are not
# reproduced here; extend carefully before production traffic.

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    - name: http_redirect
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 80
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: dpay_http_redirect
                codec_type: AUTO
                route_config:
                  name: redirect_https
                  virtual_hosts:
                    - name: redirect
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          redirect:
                            https_redirect: true
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    - name: https_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 443
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: AUTO
                stat_prefix: dpay_gateway_https
                use_remote_address: true
                normalize_path: true
                merge_slashes: true
                generate_request_id: true
                always_set_request_id_in_response: true
                request_timeout: 30s
                stream_idle_timeout: 60s
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                route_config:
                  name: dpay_routes
                  virtual_hosts:
                    - name: dpay_dev
                      domains:
                        - "dev.dlend.ir"
                        - "api.dev.dlend.ir"
                        - "s.dev.dlend.ir"
                        - "*"
                      routes:
                        # Identity HTTP API
                        - match:
                            prefix: "/identity/"
                          route:
                            cluster: identity_service
                            prefix_rewrite: "/"
                            timeout: 30s

                        - match:
                            prefix: "/.well-known/jwks"
                          route:
                            cluster: identity_service
                            timeout: 10s

                        # Customer HTTP API
                        - match:
                            prefix: "/customer/"
                          route:
                            cluster: customer_service
                            prefix_rewrite: "/"
                            timeout: 30s

                        # Financial Core HTTP API
                        - match:
                            prefix: "/financial/"
                          route:
                            cluster: financial_service
                            prefix_rewrite: "/"
                            timeout: 30s

                        # BNPL (default API surface)
                        - match:
                            prefix: "/api/"
                          route:
                            cluster: bnpl_backend
                            timeout: 30s

                        - match:
                            prefix: "/swagger/"
                          route:
                            cluster: bnpl_backend
                            timeout: 30s

                        - match:
                            prefix: "/health"
                          route:
                            cluster: bnpl_backend
                            timeout: 5s

                        - match:
                            prefix: "/"
                          route:
                            cluster: bnpl_backend
                            timeout: 30s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain:
                      filename: /etc/envoy/certs/tls.crt
                    private_key:
                      filename: /etc/envoy/certs/tls.key

  clusters:
    - name: bnpl_backend
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: bnpl_backend
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: dpay-bnpl
                      port_value: 8080

    - name: identity_service
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: identity_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: dpay-identity
                      port_value: 8080

    - name: customer_service
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: customer_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: dpay-customer
                      port_value: 8081

    - name: financial_service
      connect_timeout: 5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: financial_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: dpay-financial-core
                      port_value: 8082
