# BNPL test Loki (single-binary). Not HA. Not production.
# Restricted/test network only: auth_enabled is false by design for this pack.
# Do not expose port 3100 beyond the host loopback without adding auth/gateway.

auth_enabled: false

server:
  http_listen_address: 0.0.0.0
  http_listen_port: 3100
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki/chunks
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 50
  delete_request_store: filesystem

limits_config:
  allow_structured_metadata: true
  volume_enabled: true
  retention_period: 744h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # Prevent Loki 3 from inventing indexed service_name / detected_level labels.
  discover_service_name: []
  discover_log_levels: false
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 15MB
  max_structured_metadata_size: 64KB
  max_structured_metadata_entries_count: 128
  # Targeted delete API stays off for this test pack.
  deletion_mode: disabled

analytics:
  reporting_enabled: false
