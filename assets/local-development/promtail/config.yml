      - 2006-01-02T15:04:05.000Z07:00
      - '2006-01-02T15:04:05Z'
      action_on_failure: skip
  - labels:
      level: null
  - structured_metadata:
      logger: null
      thread: null
      trace_id: null
      span_id: null
      subject_id: null
      request_id: null
      correlation_id: null
      http_method: null
      http_path: null
      http_status: null
      latency_ms: null
- job_name: services-docker
  docker_sd_configs:
  - host: unix:///var/run/docker.sock
    refresh_interval: 5s
    filters:
    - name: label
      values:
      - logging.parstis.enabled=true
  relabel_configs:
  - source_labels:
    - __meta_docker_container_label_com_docker_compose_service
    regex: (identity-service|merchant-service|location-service|bnpl-service|document-service|financial-core-service|customer-service|notification-service)
    action: keep
  - source_labels:
    - __meta_docker_container_label_com_docker_compose_service
    target_label: service
  - source_labels:
    - service
    regex: identity-service
    target_label: source_selection
    replacement: ${IDENTITY_LOG_SOURCE:-host}
  - source_labels:
    - service
    regex: merchant-service
    target_label: source_selection
    replacement: ${MERCHANT_LOG_SOURCE:-host}
  - source_labels:
    - service
    regex: location-service
    target_label: source_selection
    replacement: ${LOCATION_LOG_SOURCE:-host}
  - source_labels:
    - service
    regex: bnpl-service
    target_label: source_selection
    replacement: ${BNPL_LOG_SOURCE:-host}
  - source_labels:
    - service
    regex: document-service
    target_label: source_selection
    replacement: ${DOCUMENT_LOG_SOURCE:-host}
  - source_labels:
    - service
    regex: financial-core-service
    target_label: source_selection
    replacement: ${FINANCIAL_CORE_LOG_SOURCE:-host}
  - source_labels:
    - service
    regex: customer-service
    target_label: source_selection
    replacement: ${CUSTOMER_LOG_SOURCE:-host}
  - source_labels:
    - service
    regex: notification-service
    target_label: source_selection
    replacement: ${NOTIFICATION_LOG_SOURCE:-host}
  - source_labels:
    - source_selection
    regex: docker
    action: keep
  - regex: source_selection
    action: labeldrop
  - target_label: job
    replacement: services-docker
  - target_label: application_env
    replacement: test
  - source_labels:
    - __meta_docker_container_log_stream
    target_label: stream
  pipeline_stages:
  - json:
      expressions:
        timestamp: timestamp
        timestamp_at: '"@timestamp"'
        level: level
        logger: logger
        thread: thread
        service_field: service
        env: env
        application_env_field: application_env
        message: message
        trace_id: trace_id
        request_id: request_id
        correlation_id: correlation_id
        span_id: span_id
        subject_id: subject_id
  - template:
      source: level
      template: '{{ if .level }}{{ ToUpper .level }}{{ end }}'
  - template:
      source: ts_final
      template: '{{ if .timestamp }}{{ .timestamp }}{{ else if .timestamp_at }}{{
        .timestamp_at }}{{ end }}'
  - template:
      source: access_body
      template: '{{ if eq .logger "ir.parstis.common.http.access" }}{{ .message }}{{
        end }}'
  - regex:
      source: access_body
      expression: ^http_access method=(?P<http_method>GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS|OTHER)
        route=(?P<http_path>[A-Za-z0-9._~/{?}*-]{1,256}) status=(?P<http_status>[1-5][0-9]{2})
        duration_ms=(?P<latency_ms>[0-9]{1,12}) request_id=(?P<http_request_id>[A-Za-z0-9._:-]{1,128})
        correlation_id=(?P<http_correlation_id>[A-Za-z0-9._:-]{1,128})$
  - template:
      source: request_id
      template: '{{ if .request_id }}{{ .request_id }}{{ else if .http_request_id
        }}{{ .http_request_id }}{{ end }}'
  - template:
      source: correlation_id
      template: '{{ if .correlation_id }}{{ .correlation_id }}{{ else if .http_correlation_id
        }}{{ .http_correlation_id }}{{ end }}'
  - timestamp:
      source: ts_final
      format: '2006-01-02T15:04:05.000Z'
      fallback_formats:
      - RFC3339Nano
      - RFC3339
      - 2006-01-02T15:04:05.000Z07:00
      - '2006-01-02T15:04:05Z'
      action_on_failure: skip
  - labels:
      level: null
  - structured_metadata:
      logger: null
      thread: null
      trace_id: null
      span_id: null
      subject_id: null
      request_id: null
      correlation_id: null
      http_method: null
      http_path: null
      http_status: null
      latency_ms: null
