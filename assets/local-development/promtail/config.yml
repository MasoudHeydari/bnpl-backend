# Generated static eight-service config. Collector owns service labels.
server:
  http_listen_address: 0.0.0.0
  http_listen_port: 3101
  grpc_listen_port: 0
positions:
  filename: /var/lib/promtail/positions.yaml
clients:
- url: http://loki:3100/loki/api/v1/push
  batchwait: 1s
  batchsize: 1048576
  timeout: 10s
scrape_configs:
- job_name: identity-service-host
  static_configs:
  - targets:
    - localhost
    labels:
      job: services-host
      service: identity-service
      application_env: test
      source_selection: ${IDENTITY_LOG_SOURCE:-host}
      __path__: /host-logs/identity-service/**/*.log
  - targets:
    - localhost
    labels:
      job: services-host
      service: identity-service
      application_env: test
      source_selection: ${IDENTITY_LOG_SOURCE:-host}
      __path__: /host-logs/identity-service/**/*.json
  relabel_configs:
  - source_labels:
    - source_selection
    regex: host
    action: keep
  - regex: source_selection
    action: labeldrop
  pipeline_stages:
  - json:
      expressions:
        timestamp: timestamp
        timestamp_at: '"@timestamp"'
        level: level
        logger: logger
        thread: thread
        service_field: service
        env: env
        application_env_field: application_env
        message: message
        trace_id: trace_id
        request_id: request_id
        correlation_id: correlation_id
        span_id: span_id
        subject_id: subject_id
  - template:
      source: level
      template: '{{ if .level }}{{ ToUpper .level }}{{ end }}'
  - template:
      source: ts_final
      template: '{{ if .timestamp }}{{ .timestamp }}{{ else if .timestamp_at }}{{
        .timestamp_at }}{{ end }}'
  - template:
      source: access_body
      template: '{{ if eq .logger "ir.parstis.common.http.access" }}{{ .message }}{{
        end }}'
  - regex:
      source: access_body
      expression: ^http_access method=(?P<http_method>GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS|OTHER)
        route=(?P<http_path>[A-Za-z0-9._~/{?}*-]{1,256}) status=(?P<http_status>[1-5][0-9]{2})
        duration_ms=(?P<latency_ms>[0-9]{1,12}) request_id=(?P<http_request_id>[A-Za-z0-9._:-]{1,128})
        correlation_id=(?P<http_correlation_id>[A-Za-z0-9._:-]{1,128})$
  - template:
      source: request_id
      template: '{{ if .request_id }}{{ .request_id }}{{ else if .http_request_id
        }}{{ .http_request_id }}{{ end }}'
  - template:
      source: correlation_id
      template: '{{ if .correlation_id }}{{ .correlation_id }}{{ else if .http_correlation_id
        }}{{ .http_correlation_id }}{{ end }}'
  - timestamp:
      source: ts_final
      format: '2006-01-02T15:04:05.000Z'
      fallback_formats:
      - RFC3339Nano
      - RFC3339
      - 2006-01-02T15:04:05.000Z07:00
      - '2006-01-02T15:04:05Z'
      action_on_failure: skip
  - labels:
      level: null
  - structured_metadata:
      logger: null
      thread: null
      trace_id: null
      span_id: null
      subject_id: null
      request_id: null
      correlation_id: null
      http_method: null
      http_path: null
      http_status: null
      latency_ms: null
