# LOCAL DEVELOPMENT ONLY. The gateway proof is a placeholder: set the private
# deployment proof before use, matching the trusted upstream service values.
# This snapshot is host-specific; Envoy source generation lives in platform-infra.
# JSON response body logging may expose sensitive data; never use in production.
# ============================================================================
# Platform Envoy Gateway - Development
# ============================================================================
# GENERATED by scripts/render-envoy.py. Do not edit generated output directly.
# Envoy static YAML has no native import/include support, so service fragments
# are merged into one final envoy.yaml at build time.

# Merged with envoy_v1 identity/authentication contract for development.
# ============================================================================
admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901

static_resources:
  listeners:
    - name: https_listener
      address:
        socket_address:
          address: 192.168.1.104
          port_value: 8443
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: AUTO
                stat_prefix: platform_gateway_http
                use_remote_address: true
                normalize_path: true
                merge_slashes: true
                generate_request_id: true
                always_set_request_id_in_response: true
                request_timeout: 30s
                stream_idle_timeout: 60s
                request_headers_timeout: 5s
                max_request_headers_kb: 32

                common_http_protocol_options:
                  headers_with_underscores_action: REJECT_REQUEST
                path_with_escaped_slashes_action: REJECT_REQUEST
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          timestamp: "%START_TIME%"

                          # Request
                          method: "%REQ(:METHOD)%"
                          path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                          full_url: "%REQ(:SCHEME)%://%REQ(:AUTHORITY)%%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                          request_body: "%DYNAMIC_METADATA(envoy.filters.http.lua:request_body)%"
                          request_body_capture_state: "%DYNAMIC_METADATA(envoy.filters.http.lua:request_body_capture_state)%"
                          protocol: "%PROTOCOL%"
                          authority: "%REQ(:AUTHORITY)%"
                          scheme: "%REQ(:SCHEME)%"

                          origin: "%REQ(ORIGIN)%"
                          access_control_request_method: "%REQ(ACCESS-CONTROL-REQUEST-METHOD)%"
                          access_control_request_headers: "%REQ(ACCESS-CONTROL-REQUEST-HEADERS)%"

                          # Request headers useful for debugging
                          host: "%REQ(HOST)%"
                          referer: "%REQ(REFERER)%"
                          accept: "%REQ(ACCEPT)%"
                          accept_language: "%REQ(ACCEPT-LANGUAGE)%"
                          content_length: "%REQ(CONTENT-LENGTH)%"
                          x_forwarded_proto: "%REQ(X-FORWARDED-PROTO)%"

                          # CORS response
                          access_control_allow_origin: "%RESP(ACCESS-CONTROL-ALLOW-ORIGIN)%"
                          access_control_allow_methods: "%RESP(ACCESS-CONTROL-ALLOW-METHODS)%"
                          access_control_allow_headers: "%RESP(ACCESS-CONTROL-ALLOW-HEADERS)%"
                          access_control_allow_credentials: "%RESP(ACCESS-CONTROL-ALLOW-CREDENTIALS)%"

                          # TLS / connection
                          requested_server_name: "%REQUESTED_SERVER_NAME%"
                          downstream_tls_version: "%DOWNSTREAM_TLS_VERSION%"
                          downstream_tls_cipher: "%DOWNSTREAM_TLS_CIPHER%"

                          # Request identity / tracing
                          request_id: "%REQ(X-REQUEST-ID)%"
                          trace_id: "%REQ(X-TRACE-ID)%"
                          correlation_id: "%REQ(X-CORRELATION-ID)%"

                          # Authentication context
                          auth_subject_id: "%REQ(X-AUTH-SUBJECT-ID)%"
                          auth_tenant_id: "%REQ(X-AUTH-TENANT-ID)%"

                          # Client information
                          user_agent: "%REQ(USER-AGENT)%"
                          forwarded_for: "%REQ(X-FORWARDED-FOR)%"
                          downstream_remote_address: "%DOWNSTREAM_REMOTE_ADDRESS%"
                          downstream_direct_remote_address: "%DOWNSTREAM_DIRECT_REMOTE_ADDRESS%"
                          downstream_local_address: "%DOWNSTREAM_LOCAL_ADDRESS%"

                          # Routing
                          route_name: "%ROUTE_NAME%"
                          upstream_cluster: "%UPSTREAM_CLUSTER%"
                          upstream_host: "%UPSTREAM_HOST%"
                          upstream_local_address: "%UPSTREAM_LOCAL_ADDRESS%"
                          upstream_protocol: "%UPSTREAM_PROTOCOL%"

                          # Response
                          response_code: "%RESPONSE_CODE%"
                          response_status_text: "%DYNAMIC_METADATA(envoy.filters.http.lua:response_status_text)%"
                          response_body: "%DYNAMIC_METADATA(envoy.filters.http.lua:response_body)%"
                          response_body_truncated: "%DYNAMIC_METADATA(envoy.filters.http.lua:response_body_truncated)%"
                          response_body_capture_state: "%DYNAMIC_METADATA(envoy.filters.http.lua:response_body_capture_state)%"
                          response_code_details: "%RESPONSE_CODE_DETAILS%"
                          response_flags: "%RESPONSE_FLAGS%"

                          # Timing
                          duration_ms: "%DURATION%"
                          request_duration_ms: "%REQUEST_DURATION%"
                          request_tx_duration_ms: "%REQUEST_TX_DURATION%"
                          response_duration_ms: "%RESPONSE_DURATION%"
                          response_tx_duration_ms: "%RESPONSE_TX_DURATION%"

                          # Payload size
                          request_body_bytes: "%BYTES_RECEIVED%"
                          response_body_bytes: "%BYTES_SENT%"
                          request_headers_bytes: "%REQUEST_HEADERS_BYTES%"
                          response_headers_bytes: "%RESPONSE_HEADERS_BYTES%"

                          # Retry / upstream attempts
                          upstream_request_attempt_count: "%UPSTREAM_REQUEST_ATTEMPT_COUNT%"

                          # Failure diagnostics
                          upstream_transport_failure_reason: "%UPSTREAM_TRANSPORT_FAILURE_REASON%"
                          connection_termination_details: "%CONNECTION_TERMINATION_DETAILS%"

                          # Useful response/request headers
                          upstream_service_time_ms: "%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%"
                          content_type: "%RESP(CONTENT-TYPE)%"

                          # Connection / stream identifiers
                          connection_id: "%CONNECTION_ID%"
                          stream_id: "%STREAM_ID%"

                route_config:
                  name: platform_gateway_routes
                  virtual_hosts:
                    # BNPL short links are publicly accessible only on their own host.
                    # Development needs DNS and a TLS certificate including s.dpay.ir.
                    # Match authority with and without the development listener port.
                    - name: bnpl_short_links
#                      domains: ["dlend.ir", "dlend.ir:443", "dlend.ir:8443"]
                      domains:
                        - "dpay.ir"
                        - "dpay.ir:443"
                        - "dpay.ir:8443"
                      routes:
                        # Restrict public redirects to a single path segment (opaque code).
                        # Do not expose /api/v1 or operational paths on this virtual host.
                        - match:
                            safe_regex:
                              regex: "^/[A-Za-z0-9_-]+$"
                            headers:
                              - name: ":method"
                                string_match:
                                  exact: "GET"
                          route:
                            cluster: "bnpl_backend"
                            timeout: 10s

                    - name: platform_services
                      domains: ["*"]
                      typed_per_filter_config:
                        envoy.filters.http.cors:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                          allow_origin_string_match:
                            - exact: http://localhost:5173
                            - exact: http://127.0.0.1:5173
                            - exact: http://localhost:3000
                            - exact: http://localhost:3001
                            - exact: http://127.0.0.1:3000
                            - exact: http://localhost:8080
                            - exact: https://frontend.bnpl.test:5173
                            - prefix: http://192.168.
                          allow_methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
                          allow_headers: >-
                            authorization,
                            content-type,
                            accept,
                            accept-language,
                            x-request-id,
                            x-trace-id,
                            x-correlation-id,
                            x-client-id,
                            x-device-id,
                            idempotency-key,
                            x-idempotency-key,
                            x-signup-continuation,
                            x-document-kind,
                            x-signatory-national-code
                          expose_headers: >-
                            x-request-id,
                            x-trace-id,
                            x-correlation-id
                          allow_credentials: true
                          max_age: "86400"
                          forward_not_matching_preflights: false
                      routes:
                        # ── Platform Gateway ──────────────────────────────────────────────────────
                        - match:
                            path: "/healthz"
                          direct_response:
                            status: 200
                            body:
                              inline_string: '{"status":"UP","service":"platform-envoy"}'
                          response_headers_to_add:
                            - header:
                                key: "content-type"
                                value: "application/json"

                        # ── Identity: Documentation & JWKS ────────────────────────────────────────
                        - match:
                            path: "/swagger/auth-api.yaml"
                          route:
                            cluster: "identity_service"
                            timeout: 10s

                        - match:
                            path: "/identity/swagger/auth-api.yaml"
                          route:
                            cluster: "identity_service"
                            prefix_rewrite: "/swagger/auth-api.yaml"
                            timeout: 10s

                        - match:
                            path: "/identity/swagger"
                          route:
                            cluster: "identity_service"
                            prefix_rewrite: "/swagger"
                            timeout: 10s

                        - match:
                            path: "/identity/openapi"
                          route:
                            cluster: "identity_service"
                            prefix_rewrite: "/openapi"
                            timeout: 10s

                        - match:
                            path: "/.well-known/jwks.json"
                          route:
                            cluster: "identity_service"
                            timeout: 5s

                        # ── BNPL: Health & Documentation ──────────────────────────────────────────
                        - match:
                            path: "/healthz/live"
                          route:
                            cluster: "bnpl_backend"
                            timeout: 5s

                        - match:
                            path: "/healthz/ready"
                          route:
                            cluster: "bnpl_backend"
                            timeout: 5s

                        - match:
                            path_separated_prefix: "/bnpl/swagger"
                          route:
                            cluster: "bnpl_backend"
                            prefix_rewrite: "/swagger"
                            timeout: 10s

                        # ── BNPL: Partner Checkout APIs ──────────────────────────────────────────
                        #
                        # Partner endpoints authenticate in BNPL with X-Terminal-Id + X-API-Key.
                        # They intentionally bypass the gateway JWT requirement.
                        - match:
                            path_separated_prefix: "/api/v1/partner"
                          route:
                            cluster: "bnpl_backend"
                            timeout: 30s

                        # ── BNPL: Read APIs ───────────────────────────────────────────────────────
                        #
                        # GET requests are safe to retry on transient upstream/network failures.
                        - match:
                            path_separated_prefix: "/api/v1/contracts"
                            headers:
                              - name: ":method"
                                string_match:
                                  exact: "GET"
                          route:
                            cluster: "bnpl_backend"
                            timeout: 30s
                            retry_policy:
                              retry_on: "connect-failure,refused-stream,reset,gateway-error"
                              num_retries: 1
                              per_try_timeout: 15s

                        - match:
                            path_separated_prefix: "/api/v1/installments"
                            headers:
                              - name: ":method"
                                string_match:
                                  exact: "GET"
                          route:
                            cluster: "bnpl_backend"
                            timeout: 30s
                            retry_policy:
                              retry_on: "connect-failure,refused-stream,reset,gateway-error"
                              num_retries: 1
                              per_try_timeout: 15s

                        - match:
                            path_separated_prefix: "/api/v1/payments"
                            headers:
                              - name: ":method"
                                string_match:
                                  exact: "GET"
                          route:
                            cluster: "bnpl_backend"
                            timeout: 30s
                            retry_policy:
                              retry_on: "connect-failure,refused-stream,reset,gateway-error"
                              num_retries: 1
                              per_try_timeout: 15s

                        - match:
                            path_separated_prefix: "/api/v1/checkout-sessions"
                            headers:
                              - name: ":method"
                                string_match:
                                  exact: "GET"
                          route:
                            cluster: "bnpl_backend"
                            timeout: 30s
                            retry_policy:
                              retry_on: "connect-failure,refused-stream,reset,gateway-error"
                              num_retries: 1
                              per_try_timeout: 15s

                        # ── BNPL: API Families ────────────────────────────────────────────────────
                        #
                        # These routes also act as the non-GET fallback for resources that have a
                        # GET-specific route above.

                        - match:
                            path_separated_prefix: "/api/v1/checkout-sessions"
                          route:
                            cluster: "bnpl_backend"
                            timeout: 30s

                        - match:
                            path_separated_prefix: "/api/v1/checkout-decisions"
                          route:
                            cluster: "bnpl_backend"
                            timeout: 30s

                        - match:
                            path_separated_prefix: "/api/v1/contracts"
                          route:
                            cluster: "bnpl_backend"
                            timeout: 30s

                        - match:
                            path_separated_prefix: "/api/v1/installments"
                          route:
                            cluster: "bnpl_backend"
                            timeout: 30s

                        - match:
                            path_separated_prefix: "/api/v1/payments"
                          route:
                            cluster: "bnpl_backend"
                            timeout: 30s

                        - match:
                            path_separated_prefix: "/api/v1/customer-credit"
                          route:
                            cluster: "bnpl_backend"
                            timeout: 30s

                        - match:
                            path_separated_prefix: "/api/v1/merchant"
                          route:
                            cluster: "bnpl_backend"
                            timeout: 30s

                        # ── Identity: APIs ────────────────────────────────────────────────────────

                        - match:
                            safe_regex:
                              regex: "^/api/v[0-9]+/(auth|subjects|sessions)(/.*)?$"
                          route:
                            cluster: "identity_service"
                            timeout: 15s

                        # ── Merchant: Documentation ───────────────────────────────────────────────
                        - match:
                            prefix: "/merchant/swagger/"
                          route:
                            cluster: "merchant_service"
                            prefix_rewrite: "/swagger/"
                            timeout: 10s

                        # ── Merchant: APIs ────────────────────────────────────────────────────────
                        #
                        # Public names stay under /api/v1. Onboarding and guest signup are mounted
                        # elsewhere in Merchant, so only those two are rewritten. Merchant's
                        # /internal/v1/business-lines is intentionally not routed.
                        - match:
                            safe_regex:
                              regex: "^/api/v[0-9]+/merchant-onboarding(/.*)?$"
                          route:
                            cluster: "merchant_service"
                            timeout: 30s
                            regex_rewrite:
                              pattern:
                                regex: "^/api/v[0-9]+/merchant-onboarding(/.*)?$"
                              substitution: "/merchants/onboarding\\1"

                        # Guest signup rate-limits OTP per client address. The gateway is the
                        # trusted proxy: it sends the address it resolved and the gateway proof.
                        # Merchant accepts them only from MERCHANT_SIGNUP_TRUSTED_PROXY_PEERS.
                        # Client-supplied copies are removed in the Lua filter.
                        - match:
                            safe_regex:
                              regex: "^/api/v[0-9]+/merchant-signup(/.*)?$"
                          route:
                            cluster: "merchant_service"
                            timeout: 30s
                            regex_rewrite:
                              pattern:
                                regex: "^/api/v[0-9]+/merchant-signup(/.*)?$"
                              substitution: "/merchants/signup\\1"
                          request_headers_to_add:
                            - header:
                                key: "x-internal-signup-client-ip"
                                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                            - header:
                                key: "x-internal-signup-proxy-proof"
                                value: "subject_id"
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD

                        - match:
                            safe_regex:
                              regex: "^/api/v[0-9]+/merchant-consent-policies(/.*)?$"
                          route:
                            cluster: "merchant_service"
                            timeout: 30s

                        - match:
                            safe_regex:
                              regex: "^/api/v[0-9]+/merchants(/.*)?$"
                          route:
                            cluster: "merchant_service"
                            timeout: 30s

                        # ── Fallback ──────────────────────────────────────────────────────────────

                        - match:
                            prefix: "/"
                          direct_response:
                            status: 404
                            body:
                              inline_string: ""
                          response_headers_to_add:
                            - header:
                                key: "content-type"
                                value: "application/json"

                http_filters:
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        identity_access_token:
                          issuer: "parstis-identity-local"
                          audiences:
                            - parstis-services-local
                          from_headers:
                            - name: Authorization
                              value_prefix: 'Bearer '
                          forward: false
                          remote_jwks:
                            http_uri:
                              uri: http://192.168.1.103:8080/.well-known/jwks.json
                              cluster: identity_jwks
                              timeout: 5s
                            cache_duration:
                              seconds: 300
                          payload_in_metadata: verified_jwt
                          require_expiration: true
                      rules:
                        - match:
                            prefix: /
                            headers:
                              - name: :method
                                string_match:
                                  exact: OPTIONS
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            path: /healthz
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            path: /healthz/live
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            path: /healthz/ready
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            path_separated_prefix: /bnpl/swagger
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            path: /identity/swagger/auth-api.yaml
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            path: /identity/swagger/auth-api.yaml
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            path: /identity/swagger
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            path: /identity/openapi
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            path: /identity/.well-known/jwks.json
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            safe_regex:
                              regex: ^/api/v[0-9]+/auth/challenges/(start|verify|resend)$
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            safe_regex:
                              regex: ^/api/v[0-9]+/auth/contexts(/.*)?$
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            safe_regex:
                              regex: ^/api/v[0-9]+/auth/(sessions/issue|tokens/refresh)(/.*)?$
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            safe_regex:
                              regex: ^/api/v[0-9]+/auth/sessions$
                            headers:
                              - name: :method
                                string_match:
                                  exact: POST
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            safe_regex:
                              regex: ^/api/v[0-9]+/auth/login-flows/complete-profile$
                            headers:
                              - name: :method
                                string_match:
                                  exact: POST
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            path: /api/v1/auth/jwks
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            path_separated_prefix: /api/v1/partner
                          requires:
                            allow_missing_or_failed: {}
                        # BNPL hosted checkout uses an unguessable token and SMS OTP,
                        # not a Gateway JWT. Keep this rule above the /api/ catch-all.
                        - match:
                            path_separated_prefix: /api/v1/checkout-sessions
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            prefix: /merchant/swagger/
                          requires:
                            allow_missing_or_failed: {}
                        # Merchant guest signup is pre-session. Binding an existing account is not.
                        - match:
                            safe_regex:
                              regex: ^/api/v[0-9]+/merchant-signup/drafts/[^/]+/phone/(start|resend|verify)$
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            safe_regex:
                              regex: ^/api/v[0-9]+/merchant-signup/drafts/[^/]+/account-enrollment(/consent)?$
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            safe_regex:
                              regex: ^/api/v[0-9]+/merchant-signup/drafts/[^/]+/account-binding/consent$
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            safe_regex:
                              regex: ^/api/v[0-9]+/merchant-signup/drafts/[^/]+$
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            prefix: /api/
                          requires:
                            provider_name: identity_access_token
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      default_source_code:
                        inline_string: |
                          local function remove_trusted_headers(headers)
                            headers:remove("x-auth-subject-id")
                            headers:remove("x-auth-subject-type")
                            headers:remove("x-auth-session-id")
                            headers:remove("x-auth-tenant-id")
                            headers:remove("x-auth-context-id")
                            headers:remove("x-auth-membership-id")
                            headers:remove("x-auth-business-line")
                            headers:remove("x-auth-client-id")
                            headers:remove("x-auth-roles")
                            headers:remove("x-auth-permissions")
                            headers:remove("x-auth-mobile-number")
                            headers:remove("x-internal-auth-gateway-proof")
                            headers:remove("x-internal-signup-client-ip")
                            headers:remove("x-internal-signup-proxy-proof")
                          end
                          
                          local function non_empty_string(value)
                            if type(value) ~= "string" then
                              return nil
                            end
                          
                            local normalized = string.match(value, "^%s*(.-)%s*$")
                          
                            if normalized == nil or normalized == "" then
                              return nil
                            end
                          
                            return normalized
                          end
                          
                          local function canonical_list(value)
                            if value == nil then
                              return nil
                            end
                          
                            if type(value) ~= "table" then
                              return nil
                            end
                          
                            local normalized = {}
                          
                            for _, item in ipairs(value) do
                              local item_value = non_empty_string(item)
                          
                              if item_value == nil then
                                return nil
                              end
                          
                              table.insert(normalized, item_value)
                            end
                          
                            if #normalized == 0 then
                              return nil
                            end
                          
                            return table.concat(normalized, ",")
                          end
                          
                          local function put_optional_string(
                            headers,
                            header_name,
                            claim_value
                          )
                            local value = non_empty_string(claim_value)
                          
                            if value ~= nil then
                              headers:replace(header_name, value)
                            end
                          end
                          
                          local function put_optional_list(
                            headers,
                            header_name,
                            claim_value
                          )
                            local value = canonical_list(claim_value)
                          
                            if value ~= nil then
                              headers:replace(header_name, value)
                            end
                          end
                          
                          local function reject_invalid_principal(
                            request_handle,
                            reason
                          )
                            request_handle:logWarn(
                              "Rejecting verified JWT with invalid principal contract: "
                                .. reason
                            )
                          
                            request_handle:respond(
                              {
                                [":status"] = "401",
                                ["content-type"] = "application/json"
                              },
                              '{"code":"auth.invalid_token","message":"Authenticated principal claims are invalid.","status_code":401}'
                            )
                          end
                          
                          -- Local development only: never use raw body capture on a production gateway.
                          local body_logging_max_bytes = 4096
                          local body_logging_namespace = "envoy.filters.http.lua"

                          local function body_logging_sensitive_path(path)
                            path = string.match(path or "", "^[^?]*") or ""
                            local suffix = string.match(path, "^/api/v[0-9]+(/.*)$")
                            if not suffix then return false end
                            local prefixes = {
                              "/auth", "/subjects", "/sessions", "/checkout-sessions",
                              "/payments", "/partner", "/merchant-signup", "/merchant-onboarding"
                            }
                            for _, prefix in ipairs(prefixes) do
                              if suffix == prefix or string.sub(suffix, 1, #prefix + 1) == prefix .. "/" then
                                return true
                              end
                            end
                            return false
                          end

                          local function body_logging_capture(handle, field, sensitive)
                            local metadata = handle:streamInfo():dynamicMetadata()
                            local headers = handle:headers()
                            local state_key = field .. "_capture_state"
                            metadata:set(body_logging_namespace, state_key, "started")
                            if sensitive then
                              metadata:set(body_logging_namespace, field, "[REDACTED]")
                              metadata:set(body_logging_namespace, state_key, "redacted_sensitive_path")
                              return
                            end
                            local content_type = string.lower(headers:get("content-type") or "")
                            if not string.find(content_type, "application/json", 1, true)
                              and not string.find(content_type, "+json", 1, true) then
                              metadata:set(body_logging_namespace, state_key, "skipped_non_json")
                              return
                            end
                            local encoding = string.lower(headers:get("content-encoding") or "")
                            if encoding ~= "" and encoding ~= "identity" then
                              metadata:set(body_logging_namespace, state_key, "skipped_compressed")
                              return
                            end
                            -- body() buffers the entire JSON message. Even an unknown-size chunked
                            -- payload is buffered, so this is for isolated local development ONLY.
                            local declared_length = headers:get("content-length")
                            local content_length = declared_length and tonumber(declared_length) or nil
                            if declared_length and (not content_length or content_length < 0
                                or content_length % 1 ~= 0) then
                              metadata:set(body_logging_namespace, state_key, "skipped_invalid_length")
                              return
                            end
                            if content_length and content_length > body_logging_max_bytes then
                              metadata:set(body_logging_namespace, state_key, "skipped_large")
                              return
                            end
                            if content_length == 0 then
                              metadata:set(body_logging_namespace, field, "")
                              metadata:set(body_logging_namespace, state_key, "empty")
                              return
                            end
                            metadata:set(body_logging_namespace, state_key, "buffering")
                            local buffer = handle:body()
                            if not buffer then
                              metadata:set(body_logging_namespace, state_key, "missing_body")
                              return
                            end
                            local size = buffer:length()
                            if size == 0 then
                              metadata:set(body_logging_namespace, field, "")
                              metadata:set(body_logging_namespace, state_key, "empty")
                              return
                            end
                            if size > body_logging_max_bytes then
                              metadata:set(body_logging_namespace, state_key, "skipped_actual_large")
                              return
                            end
                            local ok, bytes = pcall(function() return buffer:getBytes(0, size) end)
                            if not ok then
                              metadata:set(body_logging_namespace, state_key, "read_failed")
                              handle:logWarn("Lua debug body read failed for " .. field)
                              return
                            end
                            metadata:set(body_logging_namespace, field, bytes)
                            metadata:set(body_logging_namespace, state_key, "captured")
                          end

                          function envoy_on_request(request_handle)
                            local headers = request_handle:headers()
                          
                            -- Caller-supplied trusted headers are never forwarded.
                            remove_trusted_headers(headers)
                            -- Reuse the request's redaction decision in envoy_on_response.
                            local sensitive = body_logging_sensitive_path(headers:get(":path"))
                            request_handle:streamInfo():dynamicMetadata():set(
                              body_logging_namespace, "body_logging_sensitive", sensitive)
                            body_logging_capture(request_handle, "request_body", sensitive)
                          
                            local metadata = request_handle
                              :streamInfo()
                              :dynamicMetadata()
                              :get("envoy.filters.http.jwt_authn")
                          
                            if metadata == nil then
                              return
                            end
                          
                            local claims = metadata["verified_jwt"]
                          
                            if claims == nil then
                              return
                            end
                          
                            local token_type = non_empty_string(claims["typ"])
                          
                            if token_type ~= "access" then
                              reject_invalid_principal(
                                request_handle,
                                "typ must be access"
                              )
                              return
                            end
                          
                            local subject_id = non_empty_string(claims["sub"])
                            local session_id = non_empty_string(claims["sid"])
                          
                            if subject_id == nil then
                              reject_invalid_principal(
                                request_handle,
                                "sub is required"
                              )
                              return
                            end
                          
                            if session_id == nil then
                              reject_invalid_principal(
                                request_handle,
                                "sid is required"
                              )
                              return
                            end
                          
                            local roles = claims["roles"]
                            if roles ~= nil and canonical_list(roles) == nil then
                              reject_invalid_principal(
                                request_handle,
                                "roles must be a non-empty string array"
                              )
                              return
                            end
                          
                            local permissions = claims["permissions"]
                            if permissions ~= nil
                              and type(permissions) ~= "table" then
                              reject_invalid_principal(
                                request_handle,
                                "permissions must be a string array"
                              )
                              return
                            end
                          
                            local mobile_number = claims["auth_mobile_number"]
                            if mobile_number ~= nil then
                              mobile_number = non_empty_string(mobile_number)
                              if mobile_number == nil
                                or string.match(mobile_number, "^%+[0-9]+$") == nil
                                or string.len(mobile_number) < 9
                                or string.len(mobile_number) > 16 then
                                reject_invalid_principal(
                                  request_handle,
                                  "auth_mobile_number must be canonical E.164"
                                )
                                return
                              end
                            end
                          
                            -- Gateway proof is added only after the verified JWT
                            -- satisfies the canonical Identity principal contract.
                            headers:replace(
                              "x-internal-auth-gateway-proof",
                              "subject_id"
                            )
                          
                            headers:replace(
                              "x-auth-subject-id",
                              subject_id
                            )

                            put_optional_string(
                              headers,
                              "x-auth-subject-type",
                              claims["subject_type"]
                            )
                          
                            headers:replace(
                              "x-auth-session-id",
                              session_id
                            )
                          
                            put_optional_string(
                              headers,
                              "x-auth-tenant-id",
                              claims["tid"]
                            )
                          
                            put_optional_string(
                              headers,
                              "x-auth-context-id",
                              claims["ctx"]
                            )
                          
                            put_optional_string(
                              headers,
                              "x-auth-membership-id",
                              claims["mid"]
                            )
                          
                            local business_line = non_empty_string(claims["business_line"])
                            if business_line == nil then
                              business_line = non_empty_string(claims["product"])
                            end

                            put_optional_string(
                              headers,
                              "x-auth-business-line",
                              business_line
                            )

                            put_optional_string(
                              headers,
                              "x-auth-client-id",
                              claims["client_id"]
                            )
                          
                            put_optional_list(
                              headers,
                              "x-auth-roles",
                              roles
                            )
                          
                            put_optional_list(
                              headers,
                              "x-auth-permissions",
                              permissions
                            )
                          
                            put_optional_string(
                              headers,
                              "x-auth-mobile-number",
                              mobile_number
                            )
                          end

                          -- HTTP status phrases for debug logging.
                          local http_status_text = {
                            ["100"] = "Continue",
                            ["101"] = "Switching Protocols",
                            ["102"] = "Processing",
                            ["103"] = "Early Hints",
                            ["200"] = "OK",
                            ["201"] = "Created",
                            ["202"] = "Accepted",
                            ["203"] = "Non-Authoritative Information",
                            ["204"] = "No Content",
                            ["205"] = "Reset Content",
                            ["206"] = "Partial Content",
                            ["207"] = "Multi-Status",
                            ["208"] = "Already Reported",
                            ["226"] = "IM Used",
                            ["300"] = "Multiple Choices",
                            ["301"] = "Moved Permanently",
                            ["302"] = "Found",
                            ["303"] = "See Other",
                            ["304"] = "Not Modified",
                            ["307"] = "Temporary Redirect",
                            ["308"] = "Permanent Redirect",
                            ["400"] = "Bad Request",
                            ["401"] = "Unauthorized",
                            ["402"] = "Payment Required",
                            ["403"] = "Forbidden",
                            ["404"] = "Not Found",
                            ["405"] = "Method Not Allowed",
                            ["406"] = "Not Acceptable",
                            ["407"] = "Proxy Authentication Required",
                            ["408"] = "Request Timeout",
                            ["409"] = "Conflict",
                            ["410"] = "Gone",
                            ["411"] = "Length Required",
                            ["412"] = "Precondition Failed",
                            ["413"] = "Content Too Large",
                            ["414"] = "URI Too Long",
                            ["415"] = "Unsupported Media Type",
                            ["416"] = "Range Not Satisfiable",
                            ["417"] = "Expectation Failed",
                            ["418"] = "I'm a Teapot",
                            ["421"] = "Misdirected Request",
                            ["422"] = "Unprocessable Content",
                            ["423"] = "Locked",
                            ["424"] = "Failed Dependency",
                            ["425"] = "Too Early",
                            ["426"] = "Upgrade Required",
                            ["428"] = "Precondition Required",
                            ["429"] = "Too Many Requests",
                            ["431"] = "Request Header Fields Too Large",
                            ["451"] = "Unavailable For Legal Reasons",
                            ["500"] = "Internal Server Error",
                            ["501"] = "Not Implemented",
                            ["502"] = "Bad Gateway",
                            ["503"] = "Service Unavailable",
                            ["504"] = "Gateway Timeout",
                            ["505"] = "HTTP Version Not Supported",
                            ["506"] = "Variant Also Negotiates",
                            ["507"] = "Insufficient Storage",
                            ["508"] = "Loop Detected",
                            ["510"] = "Not Extended",
                            ["511"] = "Network Authentication Required",
                          }

                          function envoy_on_response(response_handle)
                            local namespace = body_logging_namespace
                            local metadata = response_handle:streamInfo():dynamicMetadata()
                            local status = response_handle:headers():get(":status")
                            metadata:set(namespace, "response_status_text", http_status_text[status] or "Unknown")
                            metadata:set(namespace, "response_body_truncated", false)

                            local request_data = metadata:get(namespace) or {}
                            body_logging_capture(
                              response_handle,
                              "response_body",
                              request_data["body_logging_sensitive"] == true
                            )
                          end
                          
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

                local_reply_config:
                  mappers:
                    - filter:
                        status_code_filter:
                          comparison:
                            op: EQ
                            value:
                              default_value: 400
                      body_format_override:
                        content_type: application/json
                        json_format:
                          code: gateway.bad_request
                          message: Bad request.
                          status_code: '%RESPONSE_CODE%'
                          path: '%REQ(:path)%'
                          request_id: '%REQ(X-REQUEST-ID)%'
                          trace_id: '%REQ(X-TRACE-ID)%'
                          correlation_id: '%REQ(X-CORRELATION-ID)%'
                    - filter:
                        status_code_filter:
                          comparison:
                            op: EQ
                            value:
                              default_value: 401
                      body_format_override:
                        content_type: application/json
                        json_format:
                          code: gateway.unauthorized
                          message: Unauthorized.
                          status_code: '%RESPONSE_CODE%'
                          path: '%REQ(:path)%'
                          request_id: '%REQ(X-REQUEST-ID)%'
                          trace_id: '%REQ(X-TRACE-ID)%'
                          correlation_id: '%REQ(X-CORRELATION-ID)%'
                    - filter:
                        status_code_filter:
                          comparison:
                            op: EQ
                            value:
                              default_value: 403
                      body_format_override:
                        content_type: application/json
                        json_format:
                          code: gateway.forbidden
                          message: Forbidden.
                          status_code: '%RESPONSE_CODE%'
                          path: '%REQ(:path)%'
                          request_id: '%REQ(X-REQUEST-ID)%'
                          trace_id: '%REQ(X-TRACE-ID)%'
                          correlation_id: '%REQ(X-CORRELATION-ID)%'
                    - filter:
                        status_code_filter:
                          comparison:
                            op: EQ
                            value:
                              default_value: 404
                      body_format_override:
                        content_type: application/json
                        json_format:
                          code: gateway.not_found
                          message: Route not found.
                          status_code: '%RESPONSE_CODE%'
                          path: '%REQ(:path)%'
                          request_id: '%REQ(X-REQUEST-ID)%'
                          trace_id: '%REQ(X-TRACE-ID)%'
                          correlation_id: '%REQ(X-CORRELATION-ID)%'
                    - filter:
                        status_code_filter:
                          comparison:
                            op: EQ
                            value:
                              default_value: 503
                      body_format_override:
                        content_type: application/json
                        json_format:
                          code: gateway.upstream_unavailable
                          message: Upstream service unavailable.
                          status_code: '%RESPONSE_CODE%'
                          path: '%REQ(:path)%'
                          request_id: '%REQ(X-REQUEST-ID)%'
                          trace_id: '%REQ(X-TRACE-ID)%'
                          correlation_id: '%REQ(X-CORRELATION-ID)%'
                    - filter:
                        status_code_filter:
                          comparison:
                            op: EQ
                            value:
                              default_value: 504
                      body_format_override:
                        content_type: application/json
                        json_format:
                          code: gateway.upstream_timeout
                          message: Upstream service timeout.
                          status_code: '%RESPONSE_CODE%'
                          path: '%REQ(:path)%'
                          request_id: '%REQ(X-REQUEST-ID)%'
                          trace_id: '%REQ(X-TRACE-ID)%'
                          correlation_id: '%REQ(X-CORRELATION-ID)%'
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
