# dpay / Hamravesh-dev Envoy gateway (self-hosted).
#
# Derived from assets/local-development/envoy/development/config.yaml (full platform
# gateway: JWT, Lua x-auth injection, CORS, BNPL/Identity/Customer/Merchant routes).
# Adapted for the unified Compose stack:
#   - TLS-only listener on 0.0.0.0:443 (no plaintext :80)
#   - Upstream STRICT_DNS → dpay-* Compose service names
#   - Public hosts: dev.dlend.ir / api.dev.dlend.ir / s.dev.dlend.ir
#   - TLS material baked into envoy.parstis-technology-dpay-dev.svc:v0.1.0 at /etc/envoy/certs/tls.{crt,key}
#
# JWT issuer/audiences must match Identity ENV (IDENTITY_ACCESS_JWT_*). Rebuild the
# image when envoy.yaml or certs change.
#
# Merchant upstream (merchant.parstis-technology-dpay-dev.svc:8085) is declared for route parity; that service is
# not in docker-compose.dev.yml yet — those routes stay dark until it joins the net.
#
# Authoritative renderer remains platform-infra scripts/render-envoy.py; keep this
# snapshot aligned when gateway fragments change.

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    - name: https_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 443
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: AUTO
                stat_prefix: platform_gateway_http
                use_remote_address: true
                normalize_path: true
                merge_slashes: true
                generate_request_id: true
                always_set_request_id_in_response: true
                request_timeout: 30s
                stream_idle_timeout: 60s
                request_headers_timeout: 5s
                max_request_headers_kb: 32

                common_http_protocol_options:
                  headers_with_underscores_action: REJECT_REQUEST
                path_with_escaped_slashes_action: REJECT_REQUEST
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          timestamp: "%START_TIME%"

                          # Request
                          method: "%REQ(:METHOD)%"
                          path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                          full_url: "%REQ(:SCHEME)%://%REQ(:AUTHORITY)%%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
                          protocol: "%PROTOCOL%"
                          authority: "%REQ(:AUTHORITY)%"
                          scheme: "%REQ(:SCHEME)%"

                          origin: "%REQ(ORIGIN)%"
                          access_control_request_method: "%REQ(ACCESS-CONTROL-REQUEST-METHOD)%"
                          access_control_request_headers: "%REQ(ACCESS-CONTROL-REQUEST-HEADERS)%"

                          # Request headers useful for debugging
                          host: "%REQ(HOST)%"
                          referer: "%REQ(REFERER)%"
                          accept: "%REQ(ACCEPT)%"
                          accept_language: "%REQ(ACCEPT-LANGUAGE)%"
                          content_length: "%REQ(CONTENT-LENGTH)%"
                          x_forwarded_proto: "%REQ(X-FORWARDED-PROTO)%"

                          # CORS response
                          access_control_allow_origin: "%RESP(ACCESS-CONTROL-ALLOW-ORIGIN)%"
                          access_control_allow_methods: "%RESP(ACCESS-CONTROL-ALLOW-METHODS)%"
                          access_control_allow_headers: "%RESP(ACCESS-CONTROL-ALLOW-HEADERS)%"
                          access_control_allow_credentials: "%RESP(ACCESS-CONTROL-ALLOW-CREDENTIALS)%"

                          # TLS / connection
                          requested_server_name: "%REQUESTED_SERVER_NAME%"
                          downstream_tls_version: "%DOWNSTREAM_TLS_VERSION%"
                          downstream_tls_cipher: "%DOWNSTREAM_TLS_CIPHER%"

                          # Request identity / tracing
                          request_id: "%REQ(X-REQUEST-ID)%"
                          trace_id: "%REQ(X-TRACE-ID)%"
                          correlation_id: "%REQ(X-CORRELATION-ID)%"

                          # Authentication context
                          auth_subject_id: "%REQ(X-AUTH-SUBJECT-ID)%"
                          auth_tenant_id: "%REQ(X-AUTH-TENANT-ID)%"

                          # Client information
                          user_agent: "%REQ(USER-AGENT)%"
                          forwarded_for: "%REQ(X-FORWARDED-FOR)%"
                          downstream_remote_address: "%DOWNSTREAM_REMOTE_ADDRESS%"
                          downstream_direct_remote_address: "%DOWNSTREAM_DIRECT_REMOTE_ADDRESS%"
                          downstream_local_address: "%DOWNSTREAM_LOCAL_ADDRESS%"

                          # Routing
                          route_name: "%ROUTE_NAME%"
                          upstream_cluster: "%UPSTREAM_CLUSTER%"
                          upstream_host: "%UPSTREAM_HOST%"
                          upstream_local_address: "%UPSTREAM_LOCAL_ADDRESS%"
                          upstream_protocol: "%UPSTREAM_PROTOCOL%"

                          # Response
                          response_code: "%RESPONSE_CODE%"
                          response_status_text: "%DYNAMIC_METADATA(envoy.filters.http.lua:response_status_text)%"
                          response_body_capture_state: "%DYNAMIC_METADATA(envoy.filters.http.lua:response_body_capture_state)%"
                          response_body_truncated: "%DYNAMIC_METADATA(envoy.filters.http.lua:response_body_truncated)%"
                          response_code_details: "%RESPONSE_CODE_DETAILS%"
                          response_flags: "%RESPONSE_FLAGS%"

                          # Timing
                          duration_ms: "%DURATION%"
                          request_duration_ms: "%REQUEST_DURATION%"
                          request_tx_duration_ms: "%REQUEST_TX_DURATION%"
                          response_duration_ms: "%RESPONSE_DURATION%"
                          response_tx_duration_ms: "%RESPONSE_TX_DURATION%"

                          # Payload size
                          request_body_bytes: "%BYTES_RECEIVED%"
                          response_body_bytes: "%BYTES_SENT%"
                          request_headers_bytes: "%REQUEST_HEADERS_BYTES%"
                          response_headers_bytes: "%RESPONSE_HEADERS_BYTES%"

                          # Retry / upstream attempts
                          upstream_request_attempt_count: "%UPSTREAM_REQUEST_ATTEMPT_COUNT%"

                          # Failure diagnostics
                          upstream_transport_failure_reason: "%UPSTREAM_TRANSPORT_FAILURE_REASON%"
                          connection_termination_details: "%CONNECTION_TERMINATION_DETAILS%"

                          # Useful response/request headers
                          upstream_service_time_ms: "%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%"
                          content_type: "%RESP(CONTENT-TYPE)%"

                          # Connection / stream identifiers
                          connection_id: "%CONNECTION_ID%"
                          stream_id: "%STREAM_ID%"

                route_config:
                  name: platform_gateway_routes
                  virtual_hosts:
                    # BNPL short links are publicly accessible only on their own host.
                    # Needs DNS + TLS SAN including s.dev.dlend.ir.
                    # Match authority with and without explicit :443.
                    - name: bnpl_short_links
                      # SHORT_LINK_PUBLIC_HOST — TLS SAN must include s.dev.dlend.ir
                      domains:
                        - "s.dev.dlend.ir"
                        - "s.dev.dlend.ir:443"
                      routes:
                        # Restrict public redirects to a single path segment (opaque code).
                        # Do not expose /api/v1 or operational paths on this virtual host.
                        - match:
                            safe_regex:
                              regex: "^/[A-Za-z0-9_-]+$"
                            headers:
                              - name: ":method"
                                string_match:
                                  exact: "GET"
                          route:
                            cluster: "bnpl_backend"
                            timeout: 10s

                    - name: platform_services
                      domains: ["*"]
                      typed_per_filter_config:
                        envoy.filters.http.cors:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                          allow_origin_string_match:
                            - exact: https://dev.dlend.ir
                            - exact: https://api.dev.dlend.ir
                            - exact: http://localhost:5173
                            - exact: http://127.0.0.1:5173
                            - exact: http://localhost:3000
                            - exact: http://localhost:3333
                            - exact: http://127.0.0.1:3000
                            - exact: http://localhost:8080
                            - exact: https://frontend.bnpl.test:5173
                            - prefix: http://192.168.
                            - prefix: https://192.168.
                          allow_methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
                          allow_headers: >-
                            authorization,
                            content-type,
                            accept,
                            accept-language,
                            x-request-id,
                            x-trace-id,
                            x-correlation-id,
                            x-client-id,
                            x-device-id,
                            idempotency-key,
                            x-idempotency-key,
                            x-signup-continuation,
                            x-applicant-credential,
                            x-document-kind,
                            x-signatory-national-code
                          expose_headers: >-
                            x-request-id,
                            x-trace-id,
                            x-correlation-id,
                            x-applicant-credential-idle-expires-at,
                            x-applicant-credential-absolute-expires-at
                          allow_credentials: true
                          max_age: "86400"
                          forward_not_matching_preflights: false
                      routes:
                        # ── Platform Gateway ──────────────────────────────────────────────────────
                        - match:
                            path: "/healthz"
                          direct_response:
                            status: 200
                            body:
                              inline_string: '{"status":"UP","service":"platform-envoy"}'
                          response_headers_to_add:
                            - header:
                                key: "content-type"
                                value: "application/json"

                        # ── Identity: Documentation & JWKS ────────────────────────────────────────
                        - match:
                            path: "/swagger/auth-api.yaml"
                          route:
                            cluster: "identity_service"
                            timeout: 10s

                        - match:
                            path: "/identity/swagger/auth-api.yaml"
                          route:
                            cluster: "identity_service"
                            prefix_rewrite: "/swagger/auth-api.yaml"
                            timeout: 10s

                        - match:
                            path: "/identity/swagger"
                          route:
                            cluster: "identity_service"
                            prefix_rewrite: "/swagger"
                            timeout: 10s

                        - match:
                            path: "/identity/openapi"
                          route:
                            cluster: "identity_service"
                            prefix_rewrite: "/openapi"
                            timeout: 10s

                        - match:
                            path: "/.well-known/jwks.json"
                          route:
                            cluster: "identity_service"
                            timeout: 5s

                        # ── BNPL: Health & Documentation ──────────────────────────────────────────
                        - match:
                            path: "/healthz/live"
                          route:
                            cluster: "bnpl_backend"
                            timeout: 5s

                        - match:
                            path: "/healthz/ready"
                          route:
                            cluster: "bnpl_backend"
                            timeout: 5s

                        - match:
                            path_separated_prefix: "/bnpl/swagger"
                          route:
                            cluster: "bnpl_backend"
                            prefix_rewrite: "/swagger"
                            timeout: 10s

                        # ── BNPL: Partner Checkout APIs ──────────────────────────────────────────
                        #
                        # Partner endpoints authenticate in BNPL with X-Terminal-Id + X-API-Key.
                        # They intentionally bypass the gateway JWT requirement.
                        - match:
                            path_separated_prefix: "/api/v1/partner"
                          route:
                            cluster: "bnpl_backend"
                            timeout: 30s

                        # ── BNPL: Read APIs ───────────────────────────────────────────────────────
                        #
                        # GET requests are safe to retry on transient upstream/network failures.
                        - match:
                            path_separated_prefix: "/api/v1/contracts"
                            headers:
                              - name: ":method"
                                string_match:
                                  exact: "GET"
                          route:
                            cluster: "bnpl_backend"
                            timeout: 30s
                            retry_policy:
                              retry_on: "connect-failure,refused-stream,reset,gateway-error"
                              num_retries: 1
                              per_try_timeout: 15s

                        - match:
                            path_separated_prefix: "/api/v1/installments"
                            headers:
                              - name: ":method"
                                string_match:
                                  exact: "GET"
                          route:
                            cluster: "bnpl_backend"
                            timeout: 30s
                            retry_policy:
                              retry_on: "connect-failure,refused-stream,reset,gateway-error"
                              num_retries: 1
                              per_try_timeout: 15s

                        - match:
                            path_separated_prefix: "/api/v1/payments"
                            headers:
                              - name: ":method"
                                string_match:
                                  exact: "GET"
                          route:
                            cluster: "bnpl_backend"
                            timeout: 30s
                            retry_policy:
                              retry_on: "connect-failure,refused-stream,reset,gateway-error"
                              num_retries: 1
                              per_try_timeout: 15s

                        - match:
                            path_separated_prefix: "/api/v1/checkout-sessions"
                            headers:
                              - name: ":method"
                                string_match:
                                  exact: "GET"
                          route:
                            cluster: "bnpl_backend"
                            timeout: 30s
                            retry_policy:
                              retry_on: "connect-failure,refused-stream,reset,gateway-error"
                              num_retries: 1
                              per_try_timeout: 15s

                        # ── BNPL: API Families ────────────────────────────────────────────────────
                        #
                        # These routes also act as the non-GET fallback for resources that have a
                        # GET-specific route above.

                        - match:
                            path_separated_prefix: "/api/v1/checkout-sessions"
                          route:
                            cluster: "bnpl_backend"
                            timeout: 30s

                        - match:
                            path_separated_prefix: "/api/v1/checkout-decisions"
                          route:
                            cluster: "bnpl_backend"
                            timeout: 30s

                        - match:
                            path_separated_prefix: "/api/v1/contracts"
                          route:
                            cluster: "bnpl_backend"
                            timeout: 30s

                        - match:
                            path_separated_prefix: "/api/v1/installments"
                          route:
                            cluster: "bnpl_backend"
                            timeout: 30s

                        - match:
                            path_separated_prefix: "/api/v1/payments"
                          route:
                            cluster: "bnpl_backend"
                            timeout: 30s

                        - match:
                            path_separated_prefix: "/api/v1/customer-credit"
                          route:
                            cluster: "bnpl_backend"
                            timeout: 30s

                        - match:
                            path_separated_prefix: "/api/v1/merchant"
                          route:
                            cluster: "bnpl_backend"
                            timeout: 30s

                        # ── Identity: APIs ────────────────────────────────────────────────────────

                        - match:
                            safe_regex:
                              regex: "^/api/v[0-9]+/(auth|subjects|sessions)(/.*)?$"
                          route:
                            cluster: "identity_service"
                            timeout: 15s

                        # ── Merchant: Documentation ───────────────────────────────────────────────
                        - match:
                            prefix: "/merchant/swagger/"
                          route:
                            cluster: "merchant_service"
                            prefix_rewrite: "/swagger/"
                            timeout: 10s

                        # ── Merchant: APIs ────────────────────────────────────────────────────────
                        #
                        # Public names stay under /api/v1. Onboarding and guest signup are mounted
                        # elsewhere in Merchant, so onboarding, guest, and signup are rewritten. Merchant's
                        # /internal/v1/business-lines is intentionally not routed.
                        - match:
                            safe_regex:
                              regex: "^/api/v[0-9]+/merchant-onboarding(/.*)?$"
                          route:
                            cluster: "merchant_service"
                            timeout: 30s
                            regex_rewrite:
                              pattern:
                                regex: "^/api/v[0-9]+/merchant-onboarding(/.*)?$"
                              substitution: "/merchants/onboarding\\1"

                        # Guest applicants have no login token. Requirements are anonymous.
                        # The case uses X-Applicant-Credential, which Merchant checks. No signup
                        # proxy headers are added here.
                        - match:
                            safe_regex:
                              regex: "^/api/v[0-9]+/merchant-guest(/.*)?$"
                          route:
                            cluster: "merchant_service"
                            timeout: 30s
                            regex_rewrite:
                              pattern:
                                regex: "^/api/v[0-9]+/merchant-guest(/.*)?$"
                              substitution: "/merchants/guest\\1"

                        # Guest signup rate-limits OTP per client address. The gateway is the
                        # trusted proxy: it sends the address it resolved and the gateway proof.
                        # Merchant accepts them only from MERCHANT_SIGNUP_TRUSTED_PROXY_PEERS.
                        # Client-supplied copies are removed in the Lua filter.
                        - match:
                            safe_regex:
                              regex: "^/api/v[0-9]+/merchant-signup(/.*)?$"
                          route:
                            cluster: "merchant_service"
                            timeout: 30s
                            regex_rewrite:
                              pattern:
                                regex: "^/api/v[0-9]+/merchant-signup(/.*)?$"
                              substitution: "/merchants/signup\\1"
                          request_headers_to_add:
                            - header:
                                key: "x-internal-signup-client-ip"
                                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                            - header:
                                key: "x-internal-signup-proxy-proof"
                                value: "__DPAY_GATEWAY_TRUST_PROOF__"
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD

                        - match:
                            safe_regex:
                              regex: "^/api/v[0-9]+/merchant-consent-policies(/.*)?$"
                          route:
                            cluster: "merchant_service"
                            timeout: 30s

                        - match:
                            safe_regex:
                              regex: "^/api/v[0-9]+/merchants(/.*)?$"
                          route:
                            cluster: "merchant_service"
                            timeout: 30s

                        # ── Customer: APIs ────────────────────────────────────────────────────────
                        # Keep the original path; existing /api/ JWT and Lua protections apply.
                        - match:
                            safe_regex:
                              regex: "^/api/v[0-9]+/customers(/.*)?$"
                          route:
                            cluster: "customer_service"
                            timeout: 30s

                        # ── Fallback ──────────────────────────────────────────────────────────────

                        - match:
                            prefix: "/"
                          direct_response:
                            status: 404
                            body:
                              inline_string: ""
                          response_headers_to_add:
                            - header:
                                key: "content-type"
                                value: "application/json"

                http_filters:
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        identity_access_token:
                          issuer: "__DPAY_JWT_ISSUER__"
                          audiences:
                            - "__DPAY_JWT_AUDIENCE__"
                          from_headers:
                            - name: Authorization
                              value_prefix: 'Bearer '
                          forward: false
                          remote_jwks:
                            http_uri:
                              uri: http://identity.parstis-technology-dpay-dev.svc:8080/.well-known/jwks.json
                              cluster: identity_jwks
                              timeout: 5s
                            cache_duration:
                              seconds: 300
                          payload_in_metadata: verified_jwt
                          require_expiration: true
                      rules:
                        - match:
                            prefix: /
                            headers:
                              - name: :method
                                string_match:
                                  exact: OPTIONS
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            path: /healthz
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            path: /healthz/live
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            path: /healthz/ready
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            path_separated_prefix: /bnpl/swagger
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            path: /identity/swagger/auth-api.yaml
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            path: /identity/swagger/auth-api.yaml
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            path: /identity/swagger
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            path: /identity/openapi
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            path: /identity/.well-known/jwks.json
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            safe_regex:
                              regex: ^/api/v[0-9]+/auth/challenges/(start|verify|resend)$
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            safe_regex:
                              regex: ^/api/v[0-9]+/auth/contexts(/.*)?$
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            safe_regex:
                              regex: ^/api/v[0-9]+/auth/(sessions/issue|tokens/refresh)(/.*)?$
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            safe_regex:
                              regex: ^/api/v[0-9]+/auth/sessions$
                            headers:
                              - name: :method
                                string_match:
                                  exact: POST
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            safe_regex:
                              regex: ^/api/v[0-9]+/auth/login-flows/complete-profile$
                            headers:
                              - name: :method
                                string_match:
                                  exact: POST
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            path: /api/v1/auth/jwks
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            path_separated_prefix: /api/v1/partner
                          requires:
                            allow_missing_or_failed: {}
                        # BNPL hosted checkout uses an unguessable token and SMS OTP,
                        # not a Gateway JWT. Keep this rule above the /api/ catch-all.
                        - match:
                            path_separated_prefix: /api/v1/checkout-sessions
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            prefix: /merchant/swagger/
                          requires:
                            allow_missing_or_failed: {}
                        # Merchant guest signup is pre-session. Binding an existing account is not.
                        - match:
                            safe_regex:
                              regex: ^/api/v[0-9]+/merchant-signup/drafts/[^/]+/phone/(start|resend|verify)$
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            safe_regex:
                              regex: ^/api/v[0-9]+/merchant-signup/drafts/[^/]+/account-enrollment(/consent)?$
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            safe_regex:
                              regex: ^/api/v[0-9]+/merchant-signup/drafts/[^/]+/account-binding/consent$
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            safe_regex:
                              regex: ^/api/v[0-9]+/merchant-signup/drafts/[^/]+$
                          requires:
                            allow_missing_or_failed: {}
                        # Verified draft to application. Continuation plus proof, not a login Bearer.
                        - match:
                            safe_regex:
                              regex: ^/api/v[0-9]+/merchant-signup/drafts/[^/]+/applicant$
                          requires:
                            allow_missing_or_failed: {}
                        # Invitation acceptance authenticates with the draft OTP or the person's
                        # password. It does not require a membership or login Bearer.
                        - match:
                            safe_regex:
                              regex: ^/api/v[0-9]+/merchant-signup/drafts/[^/]+/admin-invitation-acceptance$
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            safe_regex:
                              regex: ^/api/v[0-9]+/merchant-signup/admin-invitations/[^/]+/accept$
                          requires:
                            allow_missing_or_failed: {}
                        # Requirements are public. Other guest paths carry X-Applicant-Credential.
                        # Merchant ignores gateway identity headers on this prefix.
                        - match:
                            safe_regex:
                              regex: ^/api/v[0-9]+/merchant-guest(/.*)?$
                          requires:
                            allow_missing_or_failed: {}
                        - match:
                            prefix: /api/
                          requires:
                            provider_name: identity_access_token
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      default_source_code:
                        inline_string: |
                          local function remove_trusted_headers(headers)
                            headers:remove("x-auth-subject-id")
                            headers:remove("x-auth-subject-type")
                            headers:remove("x-auth-session-id")
                            headers:remove("x-auth-tenant-id")
                            headers:remove("x-auth-context-id")
                            headers:remove("x-auth-membership-id")
                            headers:remove("x-auth-business-line")
                            headers:remove("x-auth-client-id")
                            headers:remove("x-auth-roles")
                            headers:remove("x-auth-permissions")
                            headers:remove("x-auth-mobile-number")
                            headers:remove("x-internal-auth-gateway-proof")
                            headers:remove("x-internal-signup-client-ip")
                            headers:remove("x-internal-signup-proxy-proof")
                          end
                          
                          local function non_empty_string(value)
                            if type(value) ~= "string" then
                              return nil
                            end
                          
                            local normalized = string.match(value, "^%s*(.-)%s*$")
                          
                            if normalized == nil or normalized == "" then
                              return nil
                            end
                          
                            return normalized
                          end
                          
                          local function canonical_list(value)
                            if value == nil then
                              return nil
                            end
                          
                            if type(value) ~= "table" then
                              return nil
                            end
                          
                            local normalized = {}
                          
                            for _, item in ipairs(value) do
                              local item_value = non_empty_string(item)
                          
                              if item_value == nil then
                                return nil
                              end
                          
                              table.insert(normalized, item_value)
                            end
                          
                            if #normalized == 0 then
                              return nil
                            end
                          
                            return table.concat(normalized, ",")
                          end
                          
                          local function put_optional_string(
                            headers,
                            header_name,
                            claim_value
                          )
                            local value = non_empty_string(claim_value)
                          
                            if value ~= nil then
                              headers:replace(header_name, value)
                            end
                          end
                          
                          local function put_optional_list(
                            headers,
                            header_name,
                            claim_value
                          )
                            local value = canonical_list(claim_value)
                          
                            if value ~= nil then
                              headers:replace(header_name, value)
                            end
                          end
                          
                          local function reject_invalid_principal(
                            request_handle,
                            reason
                          )
                            request_handle:logWarn(
                              "Rejecting verified JWT with invalid principal contract: "
                                .. reason
                            )
                          
                            request_handle:respond(
                              {
                                [":status"] = "401",
                                ["content-type"] = "application/json"
                              },
                              '{"code":"auth.invalid_token","message":"Authenticated principal claims are invalid.","status_code":401}'
                            )
                          end
                          
                          local function signup_or_guest_path(path)
                            local bare = string.match(path or "", "^[^?]*")
                            if bare == nil then
                              return false
                            end
                            return string.match(bare, "^/api/v%d+/merchant%-signup$") ~= nil
                              or string.match(bare, "^/api/v%d+/merchant%-signup/") ~= nil
                              or string.match(bare, "^/api/v%d+/merchant%-guest$") ~= nil
                              or string.match(bare, "^/api/v%d+/merchant%-guest/") ~= nil
                          end

                          -- Customer credit APIs resolve the BNPL customer through
                          -- Customer Reference Service using the authenticated mobile.
                          -- Header name stays in the x-auth-* family (gateway-injected
                          -- principal claim), not a client-supplied customer_* field.
                          local function customer_credit_path(path)
                            local bare = string.match(path or "", "^[^?]*")
                            if bare == nil then
                              return false
                            end
                            return string.match(bare, "^/api/v%d+/customer%-credit") ~= nil
                          end

                          function envoy_on_request(request_handle)
                            -- Request bodies are not read or logged: they carry passwords, OTP codes
                            -- and identity numbers, and buffering them breaks document uploads.
                            local headers = request_handle:headers()

                            -- Signup and guest JSON responses can carry an applicant credential,
                            -- a TOTP secret, or recovery codes. Do not copy those bodies into the log.
                            if signup_or_guest_path(headers:get(":path")) then
                              request_handle:streamInfo():dynamicMetadata():set(
                                "envoy.filters.http.lua",
                                "response_body_capture_state",
                                "skipped_signup_guest"
                              )
                            end
                          
                            -- Caller-supplied trusted headers are never forwarded.
                            remove_trusted_headers(headers)
                          
                            local metadata = request_handle
                              :streamInfo()
                              :dynamicMetadata()
                              :get("envoy.filters.http.jwt_authn")
                          
                            if metadata == nil then
                              return
                            end
                          
                            local claims = metadata["verified_jwt"]
                          
                            if claims == nil then
                              return
                            end
                          
                            local token_type = non_empty_string(claims["typ"])
                          
                            if token_type ~= "access" then
                              reject_invalid_principal(
                                request_handle,
                                "typ must be access"
                              )
                              return
                            end
                          
                            local subject_id = non_empty_string(claims["sub"])
                            local session_id = non_empty_string(claims["sid"])
                          
                            if subject_id == nil then
                              reject_invalid_principal(
                                request_handle,
                                "sub is required"
                              )
                              return
                            end
                          
                            if session_id == nil then
                              reject_invalid_principal(
                                request_handle,
                                "sid is required"
                              )
                              return
                            end
                          
                            local roles = claims["roles"]
                            if roles ~= nil and canonical_list(roles) == nil then
                              reject_invalid_principal(
                                request_handle,
                                "roles must be a non-empty string array"
                              )
                              return
                            end
                          
                            local permissions = claims["permissions"]
                            if permissions ~= nil
                              and type(permissions) ~= "table" then
                              reject_invalid_principal(
                                request_handle,
                                "permissions must be a string array"
                              )
                              return
                            end
                          
                            -- auth_mobile_number is Identity's canonical E.164 mobile claim.
                            -- Forwarded as x-auth-mobile-number for BNPL customer-credit routes
                            -- (ResolveCustomerByMobile → CRS customer_id). Required on
                            -- /api/vN/customer-credit/**; optional on other authenticated paths.
                            local mobile_number = non_empty_string(claims["auth_mobile_number"])
                            local require_mobile = customer_credit_path(headers:get(":path"))
                            if require_mobile and mobile_number == nil then
                              reject_invalid_principal(
                                request_handle,
                                "auth_mobile_number is required for customer credit"
                              )
                              return
                            end

                            if mobile_number ~= nil then
                              if string.match(mobile_number, "^%+[0-9]+$") == nil
                                or string.len(mobile_number) < 9
                                or string.len(mobile_number) > 16 then
                                reject_invalid_principal(
                                  request_handle,
                                  "auth_mobile_number must be canonical E.164"
                                )
                                return
                              end
                            end
                          
                            -- Gateway proof is added only after the verified JWT
                            -- satisfies the canonical Identity principal contract.
                            headers:replace(
                              "x-internal-auth-gateway-proof",
                              "__DPAY_GATEWAY_TRUST_PROOF__"
                            )
                          
                            headers:replace(
                              "x-auth-subject-id",
                              subject_id
                            )

                            put_optional_string(
                              headers,
                              "x-auth-subject-type",
                              claims["subject_type"]
                            )
                          
                            headers:replace(
                              "x-auth-session-id",
                              session_id
                            )
                          
                            put_optional_string(
                              headers,
                              "x-auth-tenant-id",
                              claims["tid"]
                            )
                          
                            put_optional_string(
                              headers,
                              "x-auth-context-id",
                              claims["ctx"]
                            )
                          
                            put_optional_string(
                              headers,
                              "x-auth-membership-id",
                              claims["mid"]
                            )
                          
                            local business_line = non_empty_string(claims["business_line"])
                            if business_line == nil then
                              business_line = non_empty_string(claims["product"])
                            end

                            put_optional_string(
                              headers,
                              "x-auth-business-line",
                              business_line
                            )

                            put_optional_string(
                              headers,
                              "x-auth-client-id",
                              claims["client_id"]
                            )
                          
                            put_optional_list(
                              headers,
                              "x-auth-roles",
                              roles
                            )
                          
                            put_optional_list(
                              headers,
                              "x-auth-permissions",
                              permissions
                            )
                          
                            put_optional_string(
                              headers,
                              "x-auth-mobile-number",
                              mobile_number
                            )
                          end
                          
                          -- HTTP reason phrases are not exposed as a native Envoy access-log operator.
                          -- Derive the standard phrase from the final HTTP :status pseudo-header.
                          local http_status_text = {
                            ["100"] = "Continue",
                            ["101"] = "Switching Protocols",
                            ["102"] = "Processing",
                            ["103"] = "Early Hints",
                            ["200"] = "OK",
                            ["201"] = "Created",
                            ["202"] = "Accepted",
                            ["203"] = "Non-Authoritative Information",
                            ["204"] = "No Content",
                            ["205"] = "Reset Content",
                            ["206"] = "Partial Content",
                            ["207"] = "Multi-Status",
                            ["208"] = "Already Reported",
                            ["226"] = "IM Used",
                            ["300"] = "Multiple Choices",
                            ["301"] = "Moved Permanently",
                            ["302"] = "Found",
                            ["303"] = "See Other",
                            ["304"] = "Not Modified",
                            ["307"] = "Temporary Redirect",
                            ["308"] = "Permanent Redirect",
                            ["400"] = "Bad Request",
                            ["401"] = "Unauthorized",
                            ["402"] = "Payment Required",
                            ["403"] = "Forbidden",
                            ["404"] = "Not Found",
                            ["405"] = "Method Not Allowed",
                            ["406"] = "Not Acceptable",
                            ["407"] = "Proxy Authentication Required",
                            ["408"] = "Request Timeout",
                            ["409"] = "Conflict",
                            ["410"] = "Gone",
                            ["411"] = "Length Required",
                            ["412"] = "Precondition Failed",
                            ["413"] = "Content Too Large",
                            ["414"] = "URI Too Long",
                            ["415"] = "Unsupported Media Type",
                            ["416"] = "Range Not Satisfiable",
                            ["417"] = "Expectation Failed",
                            ["418"] = "I'm a Teapot",
                            ["421"] = "Misdirected Request",
                            ["422"] = "Unprocessable Content",
                            ["423"] = "Locked",
                            ["424"] = "Failed Dependency",
                            ["425"] = "Too Early",
                            ["426"] = "Upgrade Required",
                            ["428"] = "Precondition Required",
                            ["429"] = "Too Many Requests",
                            ["431"] = "Request Header Fields Too Large",
                            ["451"] = "Unavailable For Legal Reasons",
                            ["500"] = "Internal Server Error",
                            ["501"] = "Not Implemented",
                            ["502"] = "Bad Gateway",
                            ["503"] = "Service Unavailable",
                            ["504"] = "Gateway Timeout",
                            ["505"] = "HTTP Version Not Supported",
                            ["506"] = "Variant Also Negotiates",
                            ["507"] = "Insufficient Storage",
                            ["508"] = "Loop Detected",
                            ["510"] = "Not Extended",
                            ["511"] = "Network Authentication Required",
                          }
                                                    function envoy_on_response(response_handle)
                            local namespace = "envoy.filters.http.lua"
                            local metadata = response_handle:streamInfo():dynamicMetadata()
                            local headers = response_handle:headers()
                            local status = headers:get(":status")
                                                      metadata:set(namespace, "response_status_text", http_status_text[status] or "Unknown")
                            local prior = metadata:get(namespace)
                            if prior ~= nil and prior["response_body_capture_state"] == "skipped_signup_guest" then
                              return
                            end
                                                      -- Development-only: raw response previews can include personal data/tokens.
                            -- Do not enable response-body logging in a production gateway.
                            local content_type = string.lower(headers:get("content-type") or "")
                            local content_encoding = string.lower(headers:get("content-encoding") or "")
                            local is_json = string.find(content_type, "application/json", 1, true)
                              or string.find(content_type, "+json", 1, true)
                                                      if not is_json then
                              metadata:set(namespace, "response_body_capture_state", "skipped_non_json")
                              return
                            end
                                                      -- Compressed response bytes are not readable JSON at this Lua filter.
                            if content_encoding ~= "" and content_encoding ~= "identity" then
                              metadata:set(namespace, "response_body_capture_state", "skipped_compressed")
                              return
                            end
                                                      -- Stream without buffering the whole response; retain at most 4096 bytes.
                            local max_bytes = 4096
                            local captured_bytes = 0
                            local total_bytes = 0
                            local pieces = {}
                                                      for chunk in response_handle:bodyChunks() do
                              local length = chunk:length()
                              total_bytes = total_bytes + length
                                                        local available = max_bytes - captured_bytes
                              local take = math.min(length, available)
                              if take > 0 then
                                pieces[#pieces + 1] = chunk:getBytes(0, take)
                                captured_bytes = captured_bytes + take
                              end
                            end
                                                      metadata:set(namespace, "response_body", table.concat(pieces))
                            metadata:set(namespace, "response_body_truncated", total_bytes > max_bytes)
                            metadata:set(namespace, "response_body_capture_state", "captured")
                          end
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

                local_reply_config:
                  mappers:
                    - filter:
                        status_code_filter:
                          comparison:
                            op: EQ
                            value:
                              default_value: 400
                      body_format_override:
                        content_type: application/json
                        json_format:
                          code: gateway.bad_request
                          message: Bad request.
                          status_code: '%RESPONSE_CODE%'
                          path: '%REQ(:path)%'
                          request_id: '%REQ(X-REQUEST-ID)%'
                          trace_id: '%REQ(X-TRACE-ID)%'
                          correlation_id: '%REQ(X-CORRELATION-ID)%'
                    - filter:
                        status_code_filter:
                          comparison:
                            op: EQ
                            value:
                              default_value: 401
                      body_format_override:
                        content_type: application/json
                        json_format:
                          code: gateway.unauthorized
                          message: Unauthorized.
                          status_code: '%RESPONSE_CODE%'
                          path: '%REQ(:path)%'
                          request_id: '%REQ(X-REQUEST-ID)%'
                          trace_id: '%REQ(X-TRACE-ID)%'
                          correlation_id: '%REQ(X-CORRELATION-ID)%'
                    - filter:
                        status_code_filter:
                          comparison:
                            op: EQ
                            value:
                              default_value: 403
                      body_format_override:
                        content_type: application/json
                        json_format:
                          code: gateway.forbidden
                          message: Forbidden.
                          status_code: '%RESPONSE_CODE%'
                          path: '%REQ(:path)%'
                          request_id: '%REQ(X-REQUEST-ID)%'
                          trace_id: '%REQ(X-TRACE-ID)%'
                          correlation_id: '%REQ(X-CORRELATION-ID)%'
                    - filter:
                        status_code_filter:
                          comparison:
                            op: EQ
                            value:
                              default_value: 404
                      body_format_override:
                        content_type: application/json
                        json_format:
                          code: gateway.not_found
                          message: Route not found.
                          status_code: '%RESPONSE_CODE%'
                          path: '%REQ(:path)%'
                          request_id: '%REQ(X-REQUEST-ID)%'
                          trace_id: '%REQ(X-TRACE-ID)%'
                          correlation_id: '%REQ(X-CORRELATION-ID)%'
                    - filter:
                        status_code_filter:
                          comparison:
                            op: EQ
                            value:
                              default_value: 503
                      body_format_override:
                        content_type: application/json
                        json_format:
                          code: gateway.upstream_unavailable
                          message: Upstream service unavailable.
                          status_code: '%RESPONSE_CODE%'
                          path: '%REQ(:path)%'
                          request_id: '%REQ(X-REQUEST-ID)%'
                          trace_id: '%REQ(X-TRACE-ID)%'
                          correlation_id: '%REQ(X-CORRELATION-ID)%'
                    - filter:
                        status_code_filter:
                          comparison:
                            op: EQ
                            value:
                              default_value: 504
                      body_format_override:
                        content_type: application/json
                        json_format:
                          code: gateway.upstream_timeout
                          message: Upstream service timeout.
                          status_code: '%RESPONSE_CODE%'
                          path: '%REQ(:path)%'
                          request_id: '%REQ(X-REQUEST-ID)%'
                          trace_id: '%REQ(X-TRACE-ID)%'
                          correlation_id: '%REQ(X-CORRELATION-ID)%'
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain:
                      filename: /etc/envoy/certs/tls.crt
                    private_key:
                      filename: /etc/envoy/certs/tls.key
