# Hamravesh Darkoob: independent gateway deployment; do not merge files.
# Internal DNS: <service>.parstis-technology-dpay-dev.svc
name: dpay-dev-gateway


services:
  envoy:
    image: registry.hamdocker.ir/parstis-technology/dpay-envoy:v0.1.0
    restart: unless-stopped
    environment:
      GATEWAY_TRUST_PROOF:
      IDENTITY_ACCESS_JWT_ISSUER:
      IDENTITY_ACCESS_JWT_AUDIENCE:
    ports:
      - "443:443"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9901'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
