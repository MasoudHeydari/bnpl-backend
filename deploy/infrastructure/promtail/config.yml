# Hamravesh Promtail — scrapes JSON/text files from the shared service-logs volume.
# BNPL (and other apps) append under /var/log/services/<service-name>/.
# Push target uses Hamravesh internal DNS (override with LOKI_PUSH_URL).

server:
  http_listen_address: 0.0.0.0
  http_listen_port: 3101
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: ${LOKI_PUSH_URL:-http://loki.parstis-technology-dpay-dev.svc:3100/loki/api/v1/push}
    batchwait: 1s
    batchsize: 1048576
    timeout: 10s

scrape_configs:
  - job_name: services-files
    static_configs:
      - targets:
          - localhost
        labels:
          job: services-files
          application_env: ${APPLICATION_ENV:-development}
          __path__: /var/log/services/**/*.jsonl
      - targets:
          - localhost
        labels:
          job: services-files
          application_env: ${APPLICATION_ENV:-development}
          __path__: /var/log/services/**/*.json
      - targets:
          - localhost
        labels:
          job: services-files
          application_env: ${APPLICATION_ENV:-development}
          __path__: /var/log/services/**/*.log
    relabel_configs:
      - source_labels: [__path__]
        regex: /var/log/services/([^/]+)/.*
        target_label: service
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            timestamp_at: '"@timestamp"'
            time: time
            level: level
            msg: msg
            message: message
            trace_id: trace_id
            request_id: request_id
            correlation_id: correlation_id
            span_id: span_id
      - template:
          source: level
          template: '{{ if .level }}{{ ToUpper .level }}{{ end }}'
      - template:
          source: ts_final
          template: '{{ if .timestamp }}{{ .timestamp }}{{ else if .timestamp_at }}{{ .timestamp_at }}{{ else if .time }}{{ .time }}{{ end }}'
      - timestamp:
          source: ts_final
          format: RFC3339Nano
          fallback_formats:
            - RFC3339
            - '2006-01-02T15:04:05.000Z'
            - '2006-01-02T15:04:05Z'
          action_on_failure: skip
      - labels:
          level:
      - structured_metadata:
          trace_id:
          request_id:
          correlation_id:
          span_id:
