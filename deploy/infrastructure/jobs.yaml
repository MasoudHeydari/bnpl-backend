# Hamravesh Darkoob: independent infrastructure-jobs deployment; do not merge files.
# Internal DNS (Hamravesh FAQ): <service>.parstis-technology-dpay-dev.svc
#
# Darkoob Docker Compose import supports ONLY these keys (Compose >= 3.0):
#   image, command, entrypoint, ports, environment, volumes, depends_on
# Unsupported here on purpose: name, restart, profiles, networks, env_file,
# healthcheck, build, container_name, tmpfs, read_only, x-* anchors/merge.
#
# One-shot job: deploy once after Kafka is reachable, then stop/remove the app.
# Do NOT leave this running as a long-lived Darkoob app.

services:
  kafka-init:
    image: registry.hamdocker.ir/parstis-technology/dpay-kafka-init:v0.1.0
    environment:
      # Keep in sync with docker-compose.local.yml kafka-init defaults and
      # .env.example KAFKA_TOPIC_* values (v1 naming).
      # Space-separated list; init-topics.sh deduplicates identical names.
      # Set here (Darkoob job ENV), not on the always-on kafka broker service.
      # notification.sms.requests is intentionally omitted — reminders use
      # notification.commands.v1 only.
      KAFKA_TOPICS: >-
        bnpl.merchant.checkout.events.v1
        financial.core.payment.results.v1
        bnpl.audit.events.v1
        financial.core.payment.application.results.v1
        financial.core.installment.payment.requests.v1
        bnpl.installment.payment.reconciliation.requests.v1
        financial.core.installment.payment.reconciliation.results.v1
        bnpl.installment.payment.reconciliation.acknowledgements.v1
        document.lifecycle.v1
        document.owner.lifecycle.v1
        financial.events.v1
        financial.provider.commands.v1
        identity.auth.revocations.v1
        identity.outbox.v1
        notification.commands.v1
        parstis.notification.lifecycle.v1
        bnpl.consumer.quarantine.v1
