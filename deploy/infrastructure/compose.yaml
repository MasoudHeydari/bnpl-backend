# Hamravesh Darkoob: independent infrastructure deployment; do not merge files.
# Internal DNS: <service>.parstis-technology-dpay-dev.svc
name: dpay-dev-infrastructure


services:
  postgres:
    image: registry.hamdocker.ir/parstis-technology/dpay-postgres:v0.1.0
    restart: unless-stopped
    environment:
      POSTGRES_DB: bnpl
      POSTGRES_USER: dpay
      POSTGRES_PASSWORD:
    volumes:
      - dpay_postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dpay -d bnpl"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: docker.arvancloud.ir/redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - dpay_redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  kafka:
    image: docker.arvancloud.ir/apache/kafka:4.3.1
    hostname: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka.parstis-technology-dpay-dev.svc:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka.parstis-technology-dpay-dev.svc:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - dpay_kafka_data:/var/lib/kafka/data
    ports:
      - "29092:29092"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 45s

  temporal:
    image: temporalio/temporal:1.8.3
    restart: unless-stopped
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--headless"]
    ports:
      - "7233:7233"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "temporal operator cluster health --address 127.0.0.1:7233 >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.54.1
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal.parstis-technology-dpay-dev.svc:7233
    ports:
      - "8233:8080"
    depends_on:
      - temporal

  # ── Loki / Promtail / Grafana (log stack) ───────────────────────────────────
  # Images bake configs (no host bind mounts). Promtail tails the shared
  # dpay_service_logs volume; BNPL must mount the same volume and set LOG_FILE.
  loki:
    image: registry.hamdocker.ir/parstis-technology/dpay-loki:v0.1.0
    restart: unless-stopped
    volumes:
      - dpay_loki_data:/loki
    ports:
      - "3100:3100"

  promtail:
    image: registry.hamdocker.ir/parstis-technology/dpay-promtail:v0.1.0
    restart: unless-stopped
    environment:
      LOKI_PUSH_URL: http://loki.parstis-technology-dpay-dev.svc:3100/loki/api/v1/push
      APPLICATION_ENV: development
    volumes:
      - dpay_promtail_positions:/var/lib/promtail
      - dpay_service_logs:/var/log/services:ro
    ports:
      - "3101:3101"
    depends_on:
      - loki

  grafana:
    image: registry.hamdocker.ir/parstis-technology/dpay-grafana:v0.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Set the real password in the Darkoob panel (see secrets.example).
      GF_SECURITY_ADMIN_PASSWORD:
      GF_SERVER_ROOT_URL: http://grafana.parstis-technology-dpay-dev.svc:3000
    volumes:
      - dpay_grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - loki

volumes:
  dpay_postgres_data:
  dpay_redis_data:
  dpay_kafka_data:
  dpay_loki_data:
  dpay_promtail_positions:
  dpay_grafana_data:
  # Shared with BNPL (and other apps): each service writes under
  # /var/log/services/<service-name>/… and Promtail tails the tree.
  dpay_service_logs:
