# Hamravesh Darkoob: independent infrastructure deployment; do not merge files.
# Internal DNS (Hamravesh FAQ): <service>.parstis-technology-dpay-dev.svc
#
# Darkoob Docker Compose import supports ONLY these keys (Compose >= 3.0):
#   image, command, entrypoint, ports, environment, volumes, depends_on
# Unsupported here on purpose: name, restart, profiles, networks, env_file,
# healthcheck, build, container_name, tmpfs, read_only, x-* anchors/merge.
# Docs: https://docs.hamravesh.com/products/darkube/create/docker-compose/
#
# Each Compose service becomes a separate Darkoob app. Named volumes become
# per-app disks (replica must stay 1). Darkoob does not share one disk across
# apps — see promtail/README.md for the dpay_service_logs implication.
#
# Put secret values in the Darkoob panel (see secrets.example); do not commit them.

services:
  # ── Loki / Promtail / Grafana (log stack) ───────────────────────────────────
  # Images bake configs (no host bind mounts). Promtail tails /var/log/services
  # on its own disk; BNPL must write the same tree on a disk it can share with
  # Promtail (or use another log ship path — see promtail/README.md).
  loki:
    image: registry.hamdocker.ir/parstis-technology/dpay-loki:v0.1.0
    volumes:
      - dpay_loki_data:/loki
    ports:
      - "3100:3100"

  promtail:
    image: registry.hamdocker.ir/parstis-technology/dpay-promtail:v0.1.0
    environment:
      LOKI_PUSH_URL: http://loki.parstis-technology-dpay-dev.svc:3100/loki/api/v1/push
      APPLICATION_ENV: development
    volumes:
      - dpay_promtail_positions:/var/lib/promtail
      - dpay_service_logs:/var/log/services
    ports:
      - "3101:3101"
    depends_on:
      - loki

  grafana:
    image: registry.hamdocker.ir/parstis-technology/dpay-grafana:v0.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Required by image entrypoint — set the real value in the Darkoob panel
      # (see secrets.example). Leaving it empty makes Grafana refuse to start.
      GF_SECURITY_ADMIN_PASSWORD:
      GF_SERVER_ROOT_URL: http://grafana.parstis-technology-dpay-dev.svc:3000
    volumes:
      - dpay_grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - loki

volumes:
  dpay_loki_data:
  dpay_promtail_positions:
  dpay_grafana_data:
  # Intended log tree: /var/log/services/<service-name>/…
  # On Darkoob this is a Promtail-app disk, not an automatically shared PVC
  # with BNPL. Coordinate disk attachment with the platform if both apps must
  # see the same files; otherwise ship logs another way.
  dpay_service_logs:
