  SHORT_LINK_REPAYMENT_DESTINATION_URL: https://dpay.ir/installments
  TASK_PAYMENT_ATTEMPT_RECONCILIATION_HANDLER: payment_attempt_reconciliation
  TASK_PAYMENT_ATTEMPT_EXPIRATION_HANDLER: payment_attempt_expiration
  TASK_REPAYMENT_REMINDER_DISPATCH_HANDLER: repayment_reminder_dispatch
  TASK_COLLECTIONS_ASSESSMENT_HANDLER: collections_assessment

services:
  bnpl-migrate:
    image: registry.hamdocker.ir/parstis-technology/bnpl-backend-dbadmin:v0.1.0-development
    restart: "no"
    profiles: ["migration"]
    environment:
      <<: *bnpl-env
      CONFIG_FILE: configs/dbadmin.yaml
    entrypoint: ["./bnpl-dbadmin"]
    command: ["db", "migrate"]

  bnpl-init:
    image: registry.hamdocker.ir/parstis-technology/bnpl-backend-dbadmin:v0.1.0-development
    restart: "no"
    profiles: ["bootstrap"]
    environment:
      <<: *bnpl-env
      CONFIG_FILE: configs/dbadmin.yaml
    entrypoint: ["./bnpl-dbadmin"]
    command: ["db", "init-dev"]
