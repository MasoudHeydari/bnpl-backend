; Supervisord is PID 1 for the BNPL Alloy runtime image.
; Lower priority starts first and shuts down last (Alloy drains after BNPL).

[supervisord]
nodaemon=true
user=bnpluser
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
nodirectory=

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; Edge Alloy — start before BNPL; stop after BNPL so remaining lines can flush.
[program:alloy]
command=/usr/local/bin/alloy run --server.http.listen-addr=127.0.0.1:12345 --storage.path=/var/log/services/alloy-data /etc/alloy/config.alloy
directory=/home/bnpluser/app
priority=10
autostart=true
autorestart=true
startsecs=3
startretries=10
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; BNPL — existing entrypoint (ends with exec so the Go process is the program child).
[program:bnpl]
command=/home/bnpluser/app/entrypoint.sh
directory=/home/bnpluser/app
priority=20
autostart=true
; Restart unexpected crashes a few times; exhausted retries → FATAL → container exit.
autorestart=unexpected
exitcodes=0
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
; Align with typical Darkoob SIGTERM grace; leave headroom for Alloy drain.
stopwaitsecs=25
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Periodic logrotate (copytruncate) — does not restart BNPL or Alloy.
[program:logrotate]
command=/home/bnpluser/app/logging/rotate-logs.sh
directory=/home/bnpluser/app
priority=30
autostart=true
autorestart=true
startsecs=1
startretries=10
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; When BNPL reaches FATAL, shut down supervisord so the container exits and
; Darkoob health/restart policy sees a real failure (not a zombie supervisor).
[eventlistener:quit_on_bnpl_fatal]
command=/home/bnpluser/app/logging/quit-on-bnpl-fatal.sh
events=PROCESS_STATE_FATAL
buffer_size=10
priority=5
autostart=true
autorestart=unexpected
stdout_logfile=/dev/null
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
