# BNPL JSONL rotation for the Alloy runtime image.
# Runs as bnpluser via rotate-logs.sh (no root cron).
#
# copytruncate keeps the Go process FD valid without reopening LOG_FILE.
# Trade-off: a small window of log loss is possible between copy and truncate.
# If Alloy is down long enough, rotated archives may be deleted before ship.

/var/log/services/bnpl-service/bnpl.jsonl {
	size 50M
	rotate 5
	missingok
	notifempty
	copytruncate
	compress
	delaycompress
	dateext
	dateformat -%Y%m%d-%H%M%S
	su bnpluser bnpluser
}
