# Hamravesh Darkoob: bnpl one-shot jobs (migrate / disposable init-dev).
# Internal DNS (Hamravesh FAQ): <service>.parstis-technology-dpay-dev.svc
#
# Darkoob Compose import supports ONLY:
#   image, command, entrypoint, ports, environment, volumes, depends_on
# Unsupported here on purpose: name, restart, profiles, networks, env_file,
# healthcheck, build, container_name, tmpfs, read_only, x-* anchors/merge.
#
# ENV must match placeholders in configs/dbadmin.yaml only — do not copy the
# full BNPL runtime checklist here. Secrets go in the Darkoob panel
# (see secrets.example); do not commit real passwords.
#
# Deploy separately from the always-on bnpl app. Each job must exit successfully.
# Do NOT leave these running as long-lived Darkoob apps.
# CONFIG_FILE is overridden to configs/dbadmin.yaml (dbadmin image default).

services:
  bnpl-migrate:
    image: registry.hamdocker.ir/parstis-technology/bnpl-backend-dbadmin:v0.1.0-development
    environment:
      CONFIG_FILE: configs/dbadmin.yaml
      APP_ENVIRONMENT: development
      POSTGRES_HOST: parstis-db-dev.parstis-technology-dpay-dev.svc
      POSTGRES_PORT: 5432
      POSTGRES_DB: bnpl_dev
      POSTGRES_SSL_MODE: disable
      DBADMIN_POSTGRES_MAX_CONNECTIONS: 2
      DBADMIN_POSTGRES_MIN_CONNECTIONS: 0
      DBADMIN_POSTGRES_MAX_CONNECTION_LIFE_TIME: 1h
      DBADMIN_POSTGRES_MAX_CONNECTION_IDLE_TIME: 10m
      DBADMIN_POSTGRES_HEALTH_CHECK_PERIOD: 30s
      DBADMIN_POSTGRES_CONNECTION_TIMEOUT: 30s
      POSTGRES_ADMIN_PGPASS: "parstis-db-dev.parstis-technology-dpay-dev.svc:5432:bnpl_dev:admin:REPLACE_BNPL_ADMIN_PASSWORD"
      POSTGRES_MIGRATOR_PGPASS: "parstis-db-dev.parstis-technology-dpay-dev.svc:5432:bnpl_dev:bnpl_migrator:REPLACE_BNPL_MIGRATOR_PASSWORD"
      POSTGRES_PROVISION_NORMAL_PASSWORD: REPLACE_BNPL_NORMAL_PASSWORD
      MIGRATIONS_FILES_DIR: assets/db/migrations
      MIGRATIONS_LOCK_TIMEOUT: 30s
      DBADMIN_LOG_FORMAT: json
    entrypoint: ["./bnpl-dbadmin"]
    command: ["db", "migrate"]

  bnpl-init:
    image: registry.hamdocker.ir/parstis-technology/bnpl-backend-dbadmin:v0.1.0-development
    environment:
      CONFIG_FILE: configs/dbadmin.yaml
      APP_ENVIRONMENT: development
      POSTGRES_HOST: parstis-db-dev.parstis-technology-dpay-dev.svc
      POSTGRES_PORT: 5432
      POSTGRES_DB: bnpl_dev
      POSTGRES_SSL_MODE: disable
      DBADMIN_POSTGRES_MAX_CONNECTIONS: 2
      DBADMIN_POSTGRES_MIN_CONNECTIONS: 0
      DBADMIN_POSTGRES_MAX_CONNECTION_LIFE_TIME: 1h
      DBADMIN_POSTGRES_MAX_CONNECTION_IDLE_TIME: 10m
      DBADMIN_POSTGRES_HEALTH_CHECK_PERIOD: 30s
      DBADMIN_POSTGRES_CONNECTION_TIMEOUT: 30s
      POSTGRES_ADMIN_PGPASS: "parstis-db-dev.parstis-technology-dpay-dev.svc:5432:bnpl_dev:admin:REPLACE_BNPL_ADMIN_PASSWORD"
      POSTGRES_MIGRATOR_PGPASS: "parstis-db-dev.parstis-technology-dpay-dev.svc:5432:bnpl_dev:bnpl_migrator:REPLACE_BNPL_MIGRATOR_PASSWORD"
      POSTGRES_PROVISION_NORMAL_PASSWORD: REPLACE_BNPL_NORMAL_PASSWORD
      MIGRATIONS_FILES_DIR: assets/db/migrations
      MIGRATIONS_LOCK_TIMEOUT: 30s
      DBADMIN_LOG_FORMAT: json
    entrypoint: ["./bnpl-dbadmin"]
    command: ["db", "init-dev"]
