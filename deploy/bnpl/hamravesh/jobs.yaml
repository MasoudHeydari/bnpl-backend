# Hamravesh Darkoob: bnpl one-shot jobs
# (migrate / disposable init-dev / trusted-customer import).
# Internal DNS (Hamravesh FAQ): <service>.parstis-technology-dpay-dev.svc
#
# Darkoob Compose import supports ONLY:
#   image, command, entrypoint, ports, environment, volumes, depends_on
# Unsupported here on purpose: name, restart, profiles, networks, env_file,
# healthcheck, build, container_name, tmpfs, read_only, x-* anchors/merge.
#
# bnpl-migrate / bnpl-init: ENV matches configs/dbadmin.yaml only (dbadmin image).
# bnpl-import-trusted-customers: runtime image + runtime ENV (keep aligned with
# compose.yaml `bnpl`). CSV is baked from trusted-customers.csv beside this file.
# Secrets go in the Darkoob panel (see secrets.example); do not commit real
# passwords.
#
# Deploy separately from the always-on bnpl app. Each job must exit successfully.
# Do NOT leave these running as long-lived Darkoob apps.

services:


  # One-shot trusted-customer import. Uses the runtime image (not dbadmin).
  # CSV is baked at assets/csv/trusted-customers/trusted-customers.csv from
  # deploy/bnpl/hamravesh/trusted-customers.csv. Keep ENV aligned with compose
  # `bnpl` (Darkoob panel secrets). TLS paths point at image-baked certs.
  # Do NOT leave this running as a long-lived Darkoob app.
  bnpl-import-trusted-customers:
    image: registry.hamdocker.ir/parstis-technology/bnpl-backend:v0.1.0-development

    # Same Darkoob rule as migrate/init: flow-form JSON arrays only. A
    # block-style list (or a single string) is joined into one Cobra argv and
    # fails with unknown command "policy-assignment import-trusted ...".
    entrypoint: ["./bnpl"]
    command: ["policy-assignment", "import-trusted", "--file", "assets/csv/trusted-customers/trusted-customers.csv", "--actor", "ops@hamravesh"]


